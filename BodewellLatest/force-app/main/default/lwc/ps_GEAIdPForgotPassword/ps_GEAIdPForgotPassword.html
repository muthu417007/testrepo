        <div class="spinner">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
            </template>
        </div>

        <template if:true={showRequestError}>
            <div class="generalErrorClass slds-m-bottom_medium">
                {errorMessage}
            </div>
        </template> 

       <!-- <label class="slds-form-element__label idp-label">

            <div>To reset your password, enter your email below. We'll send password reset instructions to the<br> email address associated with your account.</div>
        
            <br>
        <div class="slds-form-element__control">
            <input type="text" data-id="emailInput" name="emailInput" placeholder="Enter Email" class="idp-text-input email-input"

        </div>
        <div class="slds-text-color_error slds-text-align_left slds-text-body_small" if:false={isEmailValid}>
            Enter a valid email address ex: user@domain.com
