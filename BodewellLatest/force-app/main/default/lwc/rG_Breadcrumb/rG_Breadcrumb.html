<template>
    <lightning-breadcrumbs class="slds-m-bottom_large slds-m-top_medium breadcrumb-mob-space">
        <template for:each={myBreadcrumbs} for:item="crumbs">
            <lightning-breadcrumb if:true={crumbs.isActive} key={crumbs.id} label={crumbs.label} onclick={disableLink}>
            </lightning-breadcrumb>
            <lightning-breadcrumb if:false={crumbs.isActive} key={crumbs.id} label={crumbs.label} href={crumbs.url}>
            </lightning-breadcrumb>
        </template>
    </lightning-breadcrumbs>
</template>
