<template>
	<div class="form-group slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open" style="width: 100%;">
		<label class="slds-form-element__label slds-text-body_small" for="text-input-id-47">
    		Search by city and state or ZIP code
		</label>
		<div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
			<svg class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default" aria-hidden="true">
				<use xlink:href="/bodewellCommerce/assets/icons/utility-sprite/svg/symbols.svg#search"></use>
			</svg>
			<input type="search"
                class="slds-input"
				style="border-radius:0px"
                required=""
                placeholder=""
                value={searchValue}
                onkeyup={handleChange}>
        </div>
			<div if:true={hasRecommendations}>
				<div class="address-recommendations" role="listbox">
					<ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid drp-down-bg"
						role="presentation">
						<template for:each={addressRecommendations} for:item="addressRecommendation">
							<li key={addressRecommendation} role="presentation"
								onclick={handleAddressRecommendationSelect} data-value={addressRecommendation.place_id}
								class="slds-listbox__item" style="cursor: pointer;">
								<div class="slds-media__body slds-m-left_xx-small slds-m-bottom_xx-small">
									<div class="slds-grid slds-m-bottom_small">
										<div class="slds-listbox__option-text slds-listbox__option-text_entity">
											<b>{addressRecommendation.main_text}</b>
										</div>
									</div>
								</div>
							</li>
						</template>
					</ul>
				</div>
			</div>
		</div>
</template>
