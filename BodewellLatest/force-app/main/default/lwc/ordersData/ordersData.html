<template>
  <template if:true={displyflag}>
    <lightning-card icon-name="standard:orders" title="Order Summary" class="lgc-bg">
      <!--<div class="slds-box slds-theme-default">slds-p-around_medium -->


      <div class="slds-p-around_medium slds-grid slds-grid_vertical-align-center lgc-bg">
        <p class="slds-text-body_small slds-text-color_weak"> • {orderslength} order items </p>
        <div class="slds-no-flex slds-grid slds-col_bump-left">
          <div class="slds-button-group">
            <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-container-more"
              aria-haspopup="true" title="Display As Split View">
              <lightning-button-icon onclick={listView} icon-name="utility:richtextbulletedlist" variant="container"
                alternative-text="ListView"></lightning-button-icon>

              <span class="slds-assistive-text">Display As List View</span>
            </button>
          </div>

        </div>
      </div>

      <template if:true={splitview}>
        <template if:true={OrdersLoading}>
          <lightning-spinner alternative-text="Loading..." size="large"></lightning-spinner>
        </template>
        <div class="slds-split-view_container slds-is-open">

          <article aria-hidden="false" id="split-view-id"
            class="slds-split-view slds-grid slds-grid_vertical slds-grow">

            <div class="slds-grid slds-grid_vertical">
              <!--<div class="slds-split-view__list-header slds-grid">
              <span class="slds-assistive-text">Sorted by:</span>
              <span>Order Number
                <svg class="slds-icon slds-icon_xx-small slds-icon-text-default slds-align-top" aria-hidden="true">
                  <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#arrowdown"></use>
                </svg>
              </span>
              <span class="slds-assistive-text">- Descending</span>
            </div>-->
              <!--<ul aria-multiselectable="true" class="slds-scrollable_y" role="listbox"
              aria-label="Select an item to open it in a new workspace tab.">
              <template for:each={orderrecords} for:item="orderItem" for:index="index">
                <li key={orderItem.ORDER_NUMBER} title={orderItem.ORDER_NUMBER} onclick={handlePublish} data-value={orderItem.ORDER_NUMBER} class="slds-split-view__list-item" role="presentation">
                  <div   role="option" class="slds-split-view__list-item-action slds-grow slds-has-flexi-truncate"
                     data-item="1234" tabindex="0">
                    <div class="slds-grid slds-wrap">
                      <span class="slds-truncate slds-text-body_regular slds-text-color_default"
                        title={orderItem.ORDER_NUMBER}>{orderItem.ORDER_NUMBER}</span>
                        <span class="slds-truncate slds-col_bump-left" title={orderItem.CUST_PO_NUMBER}>{orderItem.CUST_PO_NUMBER}</span>
                        
                      
                    </div>
                    <div class="slds-grid slds-wrap">
                      <span class="slds-truncate" title={orderItem.ORDERED_DATE}>{orderItem.ORDERED_DATE}</span>
                      <span class="slds-truncate slds-col_bump-left" title={orderItem.ORDER_STATUS}>{orderItem.ORDER_STATUS}</span>
                    </div>
                  </div>
                </li>
              </template>
                  
              
            </ul>-->
              <div class="slds-scrollable_y" style="height:350px">
                <ul aria-multiselectable="true" role="listbox"
                  aria-label="Select an item to open it in a new workspace tab.">
                  <template for:each={orderdata} for:item="orderItem" for:index="index">

                    <li key={orderItem.ORDER_NUMBER} title={orderItem.ORDER_NUMBER} onclick={handlePublish}
                      data-value={orderItem.ORDER_NUMBER} class="slds-split-view__list-item" role="presentation">
                      <a href="javascript:void(0);" aria-selected="false" role="option"
                        class="slds-split-view__list-item-action slds-grow slds-has-flexi-truncate" tabindex="0">

                        <!--<abbr class="slds-indicator_unread" title="Unread Item" aria-label="Unread Item">
                          <span class="slds-assistive-text">●</span>
                        </abbr>-->

                        <div class="slds-grid slds-wrap">
                          <span class="slds-truncate slds-text-body_regular slds-text-color_default"
                            title={orderItem.ORDER_NUMBER}>{orderItem.ORDER_NUMBER}</span>
                          <span class="slds-truncate slds-col_bump-left"
                            title={orderItem.CUST_PO_NUMBER}>{orderItem.CUST_PO_NUMBER}</span>
                        </div>
                        <div class="slds-grid slds-wrap">
                          <span class="slds-truncate" title={orderItem.ORDERED_DATE}>{orderItem.ORDERED_DATE}</span>
                          <span class="slds-truncate slds-col_bump-left"
                            title={orderItem.ORDER_STATUS}>{orderItem.ORDER_STATUS}</span>
                        </div>
                      </a>
                    </li>
                  </template>
                </ul>
              </div>

            </div>
          </article>
        </div>

      </template>
      <c-orders-list-view onloading={handleLoading} ondoneloading={handleDoneLoading}></c-orders-list-view>
      <!--<lightning-tabset variant="Scoped">
        <lightning-tab label="Orders Summary">-->

      <template if:true={expandview}>
        <!-- Modal/Popup Box LWC starts here -->
        <section aria-describedby="modal-content-id-1" aria-labelledby="modal-heading-01" aria-modal="true"
          class="slds-modal slds-fade-in-open" role="dialog" tabindex="-1">
          <!--<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">-->
          <div class="slds-modal__container popupscreen">
            <!-- Modal/Popup Box LWC header here -->
            <header class="slds-modal__header">
              <template if:true={OrdersLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
              </template>

              <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeModal}>
                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                </lightning-icon>
                <span class="slds-assistive-text">Close</span>
              </button>
              <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Orders List View</h2>
            </header>
            <!-- Modal/Popup Box LWC body starts here -->

            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">


              <div style="height: 360px;">

                <lightning-datatable data={orderdata} columns={order_columns} onrowaction={callorderdetail}
                  key-field="id" default-sort-direction={defaultSortDirection} sorted-direction={sortDirection}
                  sorted-by={sortedBy} onsort={onHandleSort} hide-checkbox-column column-widths-mode="auto" min-column-width="150">
                </lightning-datatable>
              </div>
            </div>
            <!-- Modal/Popup Box LWC footer starts here -->
            <footer class="slds-modal__footer">
              <button class="slds-button slds-button_brand" onclick={closeModal} title="Close">Close</button>
            </footer>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
      </template>

      <!--<lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>-->

      <!-- <template if:true={expandview}>
          
          <div style="height: 360px;">
            <lightning-datatable data={orderdata} columns={order_columns} key-field="id" hide-checkbox-column
              min-column-width="150"></lightning-datatable>
          </div>
        </template>-->
      <!--</lightning-tab>
      </lightning-tabset>-->
    </lightning-card>

  </template>
</template>
