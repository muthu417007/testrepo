<template>

    <lightning-card class="card">
        <div class="slds-grid">
            <div class="title slds-col">
                Order Summary
            </div>

            <div class="edit slds-col">
                <a onclick={cartRedirect}> Edit Cart </a>
            </div>
        </div>
    </lightning-card>

    <lightning-card class="card">
        <template for:each={_cartItems} for:item="cartItem">
            <div key={cartItem.id} class="border">
            <div class="eop slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4">
                    <div class="image slds-text-align_center slds-m-around_x-small">
                        <template if:true={cartItem.ProductDetails.fields.BWC_Main_Image__c}>
                            <img src={cartItem.ProductDetails.fields.BWC_Main_Image__c}
                                alt={cartItem.ProductDetails.fields.BWC_Main_Image__c} />
                        </template>
                    </div>
                </div>


                <div class="slds-col slds-size_2-of-4">
                    <div class="content1 slds-m-around_x-small">
                        <!-- <button class="product-name slds-button" data-id={cartItem.ProductDetails.productId} onclick={onclickProductName}> -->
                        {cartItem.ProductDetails.fields.BWC_Product_Marketing_Description__c}
                        <!-- </button> -->

                        <div class="model">
                            Model#: {cartItem.ProductDetails.sku}
                        </div>
                    </div>
                </div>

                <div class="price slds-col slds-size_1-of-4">
                    <!-- ${cartItem.amount} -->
                    <template if:true={cartItem.showAsPrice}>
                        <template if:false={isUserMember}>
                            <lightning-formatted-number                   
                                value={cartItem.MSRP}
                                maximum-fraction-digits="2"
                                currency-code={currencyCode}
                                format-style="currency">
                        </lightning-formatted-number>
                        </template>
                        <template if:true={isUserMember}>
                            <lightning-formatted-number                   
                                value={cartItem.memberPrice}
                                maximum-fraction-digits="2"
                                currency-code={currencyCode}
                                format-style="currency">
                        </lightning-formatted-number>
                        </template>
                    </template>

                    <template if:true={cartItem.showAsLabels}>
                        <template if:false={isUserMember}>                           
                            <lightning-formatted-number                   
                                value={cartItem.decimalPrice}
                                maximum-fraction-digits="2"
                                currency-code={currencyCode}
                                format-style="currency">
                        </lightning-formatted-number>
                        </template>
                        <template if:true={isUserMember}>
                            <lightning-formatted-number                   
                                value={cartItem.memberPrice}
                                maximum-fraction-digits="2"
                                currency-code={currencyCode}
                                format-style="currency">
                            </lightning-formatted-number>
                        </template>
                    </template>

                </div>

              

            </div>
            <div  class="slds-grid slds-wrap">
                <div class="installation-sop slds-size_12-of-12">
                    <c-bwc_checkout-installation-services data-id={cartItem.id}  cart-item-id={cartItem.id} zip-code={zipCode}
                        product-quantity={cartItem.quantity} is-member={isUserMember}
                        product-id={cartItem.ProductDetails.productId} cart-id={cartId} oninstall={installationChangeCapture} >
                    </c-bwc_checkout-installation-services>
                </div>

            </div>

            <div class=" slds-grid slds-wrap" >

                <div class="installation-sop slds-size_12-of-12">
                    <c-bwc_bodewell-care-protection-plan data-id={cartItem.id} cart-item-id={cartItem.id}
                        product-quantity={cartItem.quantity} is-member={isUserMember} is-small-appliance={cartItem.ProductDetails.fields.BWC_Small_Appliance__c}
                        product-id={cartItem.ProductDetails.productId} service-contracts={cartItem.ProductDetails.fields.BWC_Service_Contracts__c} cart-id={cartId}>
                    </c-bwc_bodewell-care-protection-plan>
                </div>


                </div>
        </div>
        </template>

<template if:true={_cartTotal}>
    <div class="item">
        <p class="itemTitle">Subtotal</p>
        <p class="value">
            <lightning-formatted-number                   
                    value={_fixedcartTotal}
                    maximum-fraction-digits="2"
                    currency-code={currencyCode}
                    format-style="currency"></lightning-formatted-number>
        </p> 
    </div>
</template>

<template if:true={deliveryflag}>
<div class="item">
    <p class="itemTitle">In-Home Delivery</p>
    <div class="itemTitleFree">
        <template if:true={free}>
            <p class="memberValue">{free}</p>
            <p class="memberTotalvalue">${deliveryfee}</p>
        </template>
        <template if:false={free}>
            <p class="value">${deliveryfee}</p>
        </template>
    </div>
</div>
</template>

            <div class="slds-grid ">
                <div class="slds-col slds-size_1-of-2">
                    <p class="itemTitle">Installation</p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <p class="value">${installationfee}</p>
                </div>
            </div>
        </template> -->

<template if:true={partsShipFee}>
    <div class="item">     
        <p class="itemTitle">Parts Shipping</p>
        <div class="itemTitleFree">
            <template if:true={partShipppingFlag}>
                <p class="memberValue">{free}</p>
                <p class="memberTotalvalue">${partsShipFee}</p>
            </template>
            <template if:false={partShipppingFlag}>
                <p class="value">${partsShipFee}</p>
            </template>
        </div>
    </div>
</template>


    <template if:true={taxFlag}>
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="small" variant="brand"
                class="slds-m-top_small"></lightning-spinner>
        </template>
        <template if:false={showSpinner}>
            <div class="item">
                <p class="itemTitle">Tax</p>
                <p class="value">${taxAmount}</p>
            </div>
        </template>             
    </template>
   


<template if:true={promotionflag}>
    <template if:true={promotions}>
        <div class="item">
            <p class="itemTitle">Coupon/Offers</p>
            <p class="value">${_fixedPromo}</p>
        </div>
    </template>
</template>



<lightning-card class="card">
    <div class="priceCss">
        <p class="itemTitle">Total (USD)</p>
        <p class="value">
            <lightning-formatted-number                   
                    value={_fixedTotal}
                    maximum-fraction-digits="2"
                    currency-code={currencyCode}
                    format-style="currency"></lightning-formatted-number>
        </p>    
    </div>
</lightning-card>
</lightning-card>
</template>
