<template>

    <lightning-layout-item size="12">
        <lightning-layout-item size="12">
            <!-- <h2 class="subheading textcenter">{pageTitleLabel}</h2> -->
            <div class="field-wrapper callout-title-container Haier-Monogram-only">
                <div class="title-bar-circles-left"></div>
                <div class="fielditems callout-title-inner-container">
                    <div class="fielditem">
                        <h3>{pageTitleLabel}</h3>
                    </div>
                </div>
                <div class="title-bar-circles-right"></div>
            </div>
        </lightning-layout-item>
    </lightning-layout-item>
    <div class="back-color">
        <lightning-layout-item size="12">
            <div class="text-content-main">
                {T11Label} <b>&nbsp;{T12Label}&nbsp;</b> {T13Label}<br> {T21Label} <b>&nbsp;{T22Label}&nbsp;</b>
                {T23Label}
            </div>
        </lightning-layout-item>


        <lightning-layout-item size="12">
            <lightning-layout horizontal-align="center">
                <!-- <lightning-layout-item class="OrdInd"> -->
                <lightning-layout-item if:true={redirectLinkVisible} class="OrdInd">
                    <img src={SOL} />
                    <a href={redirectUrl} class="SMOL">{smartOrderLinkLabel}</a>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
        <lightning-layout>
            <div class="spinner">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
                </template>
            </div>
        </lightning-layout>
        <lightning-layout>
            <lightning-layout-item size="12">
                <div>
                    <div if:true={showPrevButtonflag}>
                        <div if:true={Orders}>
                            <button class="product-link-button-p slds-float_left" onclick={handlePrevOrder}>&lt;
                                Previous</button>
                        </div>
                    </div>
                    <div if:true={showNextButtonflag}>
                        <div if:true={Orders}>
                            <button class="product-link-button slds-float_right" onclick={handleNextOrder}>Next
                                &gt;</button>
                        </div>
                    </div>
                </div>
            </lightning-layout-item>
        </lightning-layout>

        <template iterator:it={Orders}>
            <div key={it.value.OrderNumber}>
                <lightning-layout vertical-align="stretch" multiple-rows="true"
                    class="orderDetail textcenter mob-table">
                    <lightning-layout-item flexibility="auto" size="2">
                        <span class="test"><span class="mid-align">{orderNoLabel}</span> <br>
                            <span class="order-data">{it.value.OrderNumber}</span></span>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="2">
                        <span class="test"><span class="mid-align">{orderDateLabel}</span> <br>
                            <span class="order-data">{it.value.OrderDate}</span></span>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="3">
                        <span class="test"><span class="mid-align">{orderRefNoLabel} </span><br>
                            <span class="order-data">{it.value.OrderRefNumber}</span></span>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="2">
                        <div if:true={it.value.ShipZip}>
                            <span class="test"><span class="mid-align">{orderTotalLabel}</span> <br>
                            <span class="order-data">${it.value.OrderTotalString}</span></span>
                        </div>
                        <div if:false={it.value.ShipZip}>
                            <span class="test"><span class="mid-align">{orderTotalLabel}</span> <br>
                            <span class="order-data">{it.value.OrderTotalString}</span></span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="3">
                        <span class="test"><span class="mid-align">{orderStatusLabel} </span><br>
                            <span class="order-data">{it.value.OrderStatus}</span></span>
                    </lightning-layout-item>
                </lightning-layout>
                <lightning-layout class="mob-view-set">
                    <lightning-layout-item flexibility="auto" size="9">
                        <template if:true={it.value.LineItemList}>
                            <template for:each={it.value.LineItemList} for:item="Item">
                                <div key={Item.ItemModelNo}>
                                    <div if:true={Item.ShowLineItemFlag}>
                                        <lightning-layout vertical-align="stretch" multiple-rows="true"
                                            class="ImageDescription mob-head">
                                            <lightning-layout-item flexibility="auto" size="4">
                                                <div if:true={Item.LineItemURL}>
                                                    <img class="ProductImage" src={Item.LineItemURL}>
                                                </div>
                                                <div if:false={Item.LineItemURL}>
                                                    <div if:false={Item.StandInstallFlag}>
                                                        <img class="ProductImage" src={noImage}>
                                                    </div>
                                                    <div if:true={Item.StandInstallFlag}>
                                                        <img class="ProductImage" src={image}>
                                                    </div>
                                                </div>
                                            </lightning-layout-item>
                                            <lightning-layout-item flexibility="auto" size="4">
                                                <div class="product-title">
                                                    <b>{Item.ItemModelNo}</b><br>
                                                    <span class="product-model-number">{Item.ProdDescription}</span>
                                                </div>
                                            </lightning-layout-item>
                                            <lightning-layout-item flexibility="auto" size="4">
                                            </lightning-layout-item>
                                        </lightning-layout>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" size="3">
                        <div class="product-link textcenter">
                            <div if:true={it.value.FGOrderFlag}>
                                <button onclick={handleOrderDetails} class="view-order-details"
                                    value={it.value.OrderRefNumber}>{ViewOrderLinkLabel}</button>
                            </div>
                            <div if:false={it.value.FGOrderFlag}>
                                <div>
                                    <lightning-formatted-url label={ViewOrderLinkLabel} value={it.value.PartsStatusURL}>
                                    </lightning-formatted-url>
                                </div>

                                <div if:true={it.value.ShowReturn} class="return-an-item">
                                    <lightning-formatted-url label={ReturnItemLink} value={it.value.PartsReturnURL}>
                                    </lightning-formatted-url>
                                </div>
                            </div>
                            <div if:true={it.value.OrderStatusPendFlag}>
                                <div if:true={it.value.ShipMetHomDelFlag}>
                                    <!-- <div if:true={it.value.ShowReturn} class="return-an-item">
                        <lightning-formatted-url label={ReturnItemLink} value={it.value.ReturnURL}>
                        </lightning-formatted-url>
                    </div> -->
                                    <div>
                                        <div if:true={it.value.ShowTrackMyOrder} class="track-my-order">
                                            <lightning-formatted-url label={TrackMyOrderLink}
                                                value={it.value.TrackMyOrderURL}>
                                            </lightning-formatted-url>
                                        </div>
                                        <div if:true={it.value.ShowReschedule} class="reschedule">
                                            <lightning-formatted-url label={RescheduleLink}
                                                value={it.value.RescheduleURL}>
                                            </lightning-formatted-url>
                                        </div>
                                        <div if:true={it.value.TextTrackFlag} class="delivery-info">
                                            <lightning-formatted-url label={DeliveryInformationLink}
                                                value={it.value.DeliveryInfoURL}>
                                            </lightning-formatted-url>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
                <div class="track-text" if:true={it.value.OrderStatusPendFlag}>
                    <div if:true={it.value.ShipMetHomDelFlag}>
                        <div if:true={it.value.TextTrackFlag}>
                            <span> {T31Label} <b>"{T32Label}"</b> {T33Label}</span>
                        </div>
                    </div>
                </div>
                <div class="track-text" if:false={it.value.ShipZip}>
                    <br><br><br>
                    <span> {OrderProcessMessage} </span>
                    <br><br><br>
                </div>
            </div>

        </template>
    </div>
</template>
