<template>
    <div class="spinner">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
        </template>
    </div>

    <h2 class="">
        <label class=""> {pageTitleLabel} </label>
    </h2>
    
    <div>
        <div class="slds-grid  slds-m-bottom_small slds-p-right_large slds-align_absolute-center">
            <div class="slds-m-right_small" >
                <!-- <a href="https://geapp--bwcommoob.sandbox.my.site.com/bodewellComercevforcesite/services/auth/sso/Google_GEA">
                       <img src={googleImage}>
                   </a>  -->
                <a href={googleAuthUrl}>
                    <img src={googleImage}>
                </a>
            </div>
            <div class="slds-icon" style="width: auto;height: auto;">
                <!-- <a href="https://geapp--bwcommoob.sandbox.my.site.com/bodewellComercevforcesite/services/auth/sso/Facebook_GEA">
                       <img src={facebookImage}>
                   </a> -->
                <a href={fbAuthUrl}>
                    <img src={facebookImage}>
                </a>
            </div>
        </div>
<div class={emailContainerClass}>

    <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
            <label class="slds-form-element__label" for="email">
               <b> {emailLabel}  </b>
            </label>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-form-element">
            <div class="slds-form-element__control">
                <input
                        type="email"
                        data-id="email"
                        onchange={onInputChanged}
                        name="email"
                        required=""
                        aria-describedby="email-error"
                        class="slds-input textField"
                        aria-invalid="true"
                        autocapitalize="off"
                />
            </div>
            <template if:true={emailHasError} class="slds-has-error">
                <div class="slds-form-element__help">{emailValidationError}</div>
            </template>
        </div>
      </div>


</div>
            <div>

                </label>
                
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-form-element">

                            type="text"

                            onchange={onInputChanged}
                            name="firstName"
                            required=""
                            class="slds-input textField"
                            aria-invalid="true"
                    />
                </div>
                
                <template if:true={firstNameHasError}>
                    <div class="slds-form-element__help">{firstNameValidationError}</div>
                </template>
                <template if:true={firstNameHasErrorr}>
                    <div class="slds-form-element__help slds-text-color_error">{firstNameValidationErrorr}</div>
                </template>
            </div>
                  </div>

        <div>

                <label class="slds-form-element__label idp-label" for="lastName">
                    <b> {lastNameLabel}  </b>
                </label>
                
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-form-element">
                <div class="slds-form-element__control">
                    <input
                            type="text"
                            data-id="lastName"
                            onchange={onInputChanged}
                            name="lastName"
                            required=""
                            class="slds-input textField"
                            aria-invalid="true"
                    />
                </div>
                <template if:true={lastNameHasError}>
                    <div class="slds-form-element__help">{lastNameValidationError}</div>
                </template>
                <template if:true={lastNameHasErrorr}>
                    <div class="slds-form-element__help slds-text-color_error">{lastNameValidationErrorr}</div>
                </template>
            </div>
          </div>
        </div>
        <div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <div>
                    <label class="slds-form-element__label" for="phone">
                        <b> {phoneLabel} </b> <i class="slds-text-body_small">(Optional)</i>
                     </label>
                </div>
                <div class="slds-text-body_small">
                    {phoneLabelBodewell}
                </div>
                
               
                
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">

        <lightning-input type="tel" 
            data-id="phone"
            class="textField phone-validate"
            max-length="10" pattern={phonePattern} 
            message-when-pattern-mismatch={phonePatternValidationMessage} 
            variant="label-hidden" 
            name="phone" 
            label="phone"
            onchange={onInputChangedphone}>
            </lightning-input> 

                
                <template if:true={phoneHasError}>
                    <div class="slds-form-element__help">{phoneValidationError}</div>
                </template>
            </div>
          </div>
        </div>
        <div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <div>
                    <label class="slds-form-element__label idp-label" for="password">
                   <b> {passwordLabel} </b>
                </label>
                </div>
                <div class="slds-text-body_small">
                   {passwordStrengthLabel}
                </div>
                
                
            </div>
        
            
           
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-form-element">
                <div class="slds-form-element__control">
                    <input
                            type="password"
                            data-id="password"
                            onchange={onPasswordChanged}
                            name="password"
                            required=""
                            class="slds-input textField"
                            aria-invalid="true"
                    />
                </div>
                <template if:true={passwordHasError}>
                    <div class="slds-form-element__help slds-text-color_error">{passwordValidationError}</div>
                </template>
                <template if:true={passwordStrengthHasError}>
                    <div class="slds-form-element__help slds-text-color_error">{passwordStrengthValidationError}</div>
                </template>
            </div>
          </div>  
        </div>
        <div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <label class="slds-form-element__label idp-label" for="passwordConfirmation">
                   <b> {passwordConfirmationLabel} </b>
                </label>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-form-element">
                <div class="slds-form-element__control">
                    <input
                            type="password"
                            data-id="passwordConfirmation"
                            onchange={onPasswordConfirmationChanged}
                            name="passwordConfirmation"
                            required=""
                            class="slds-input textField"
                            aria-invalid="true"
                    />
                </div>
                <template if:true={passwordConfirmationHasError}>
                    <div class="slds-form-element__help slds-text-color_error">{passwordConfirmationIsRequiredValidationError}</div>
                </template>
                <template if:true={passwordsDontMatch}>
                    <div class="slds-form-element__help slds-text-color_error">{passwordsDontMathValidationError}</div>
                </template>

            </div>
          </div>
        </div>

        <div class={termsAndConditionsClass}>
            <label>
                <p class="slds-m-top_x-small">
           
               
                <input
                        type="checkbox"
                        name="termsAndConditions"
                        required

                />
              
                   
                    <lightning-formatted-rich-text

                            value={termsAndConditionsLabel}
                    ></lightning-formatted-rich-text>
                    <a class="idp-link ipd-link-inline" href={termsAndConditionsURL} target="_blank"
                    >{termsAndConditionsURLBodewell}
