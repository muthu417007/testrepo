<template>
	<div style="margin:auto; width:60rem;">
		<div>
			<a href={subscriptionPageUrl}>
				<svg class="slds-accordion__summary-action-icon slds-button__icon slds-button__icon_left"
					aria-hidden="true">
					<use xlink:href="/bodewellCommerce/assets/icons/utility-sprite/svg/symbols.svg#chevronup">
					</use>
				</svg>
				Return to Subscriptions
			</a>
		</div>
		<div class="slds-p-vertical_x-large">
			<div class="slds-align_absolute-center slds-text-heading_large">Payment History</div>
		</div>
		<div class="slds-grid slds-gutters slds-p-around_medium" style="background-color: #DED1B1;">
			<div class="slds-text-heading_small slds-col slds-size_2-of-12">DATE</div>
			<div class="slds-text-heading_small slds-col slds-size_5-of-12">DESCRIPTION</div>
			<div class="slds-text-heading_small slds-col slds-size_3-of-12">PAYMENT METHOD</div>
			<div class="slds-text-heading_small slds-col slds-size_1-of-12">COST</div>
			<div class="slds-text-heading_small slds-col slds-size_1-of-12">TOTAL</div>
		</div>
		<div if:true={hasPpaymentHistory}>
			<template for:each={paymentHistoryInfo} for:item="point" for:index="index">
				<div key={point.id}>
					<div class="slds-grid slds-gutters slds-p-around_medium">
						<div class="slds-col slds-size_2-of-12">{point.date}</div>
						<div class="slds-col slds-size_5-of-12">{point.description}</div>
						<div class="slds-col slds-size_3-of-12">{point.method}</div>
						<div class="slds-col slds-size_1-of-12">${point.cost}</div>
						<div class="slds-col slds-size_1-of-12">${point.total}</div>
					</div>
					<hr class="slds-m-vertical_x-small" />
				</div>
			</template>
		</div>
	</div>
</template>
