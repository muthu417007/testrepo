<template>
    <div class="desktop-basic-block">
        <div class="basic-info-block">
          <div class="cta-link-container">
              <div class="p-4 cta-link-block">
                <div class="cta-icon-block" if:true={showImg}>
                    <img class="basic-img" src={imgUrl} alt="icon">
                </div>
                <div class="cta-icon-block" if:true={showHeading}>
                    <h3>{heading}</h3>
                </div>
                <div class="cta-text-block">
                   <p class="inner-content abc"><lightning-formatted-rich-text value={richtext}></lightning-formatted-rich-text></p>
                    <a href={redirectURL} onclick={handleClick}>
                        <span class="basic-info-button generic-button tertiary-transparent">{buttontext}</span>
                    </a>
                </div>
              </div>
          </div>
        </div>
    </div>
    <!-- mobile -->
    <div class="mobile-basic-block slds-wrap" if:true={showImg}>
        <div class="cta-link-container">
            <div class="slds-col slds-size_3-of-12">
                <div class="cta-icon-block">
                    <img class="basic-img" src={imgUrl} alt="icon">
                </div>
            </div>
            <div class="slds-col slds-size_9-of-12">
                <div class="cta-text-block">
                    <p class="inner-content bewvvv">
                        <lightning-formatted-rich-text value={richtext}></lightning-formatted-rich-text></p>
                 
                     <a href={redirectURL} onclick={handleClick}>
                         <button class="mob-btn">{buttontext}</button>
                     </a>
                 </div>
            </div>
            </div>
    </div>
    <div class="mobile-basic-heading-block" if:true={showHeading}>
        <div class="basic-info-block">
            <div class="cta-link-container">
                <div class="p-4 cta-link-block">
                  <div class="cta-icon-block heading-block">
                      <h3>{heading}</h3>
                  </div>
                  <div class="cta-text-block">
                     <p class="inner-content"><lightning-formatted-rich-text value={richtext}></lightning-formatted-rich-text></p>
                  
                      <a href={redirectURL} onclick={handleClick}>
                          <span  class="generic-button tertiary-transparent">{buttontext}</span>
                      </a>
                  </div>
                </div>
            </div>
          </div>
    </div>
</template>
