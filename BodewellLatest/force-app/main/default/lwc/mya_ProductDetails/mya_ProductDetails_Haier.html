<template>
  <div class="body">
    <template if:true={assetDetails.data}>
      <div id="mainContent" class="mainContent">
        <div class="middleSection">
          <div class="grid-container">
            <div class="grid1-x grid-margin-x">
              <div class="cell">
                <section class="your-appliance-section">
                  <div class="space"></div>
                  <div class="field-wrapper callout-title-container Haier-Monogram-only">
                    <div class="title-bar-circles-left"></div>
                    <div class="field-items callout-title-inner-container">
                      <div class="field-item">
                        <h3>{page_header}</h3>
                      </div>
                    </div>
                    <div class="title-bar-circles-right"></div>
                  </div>
                  <!-- product details and image -->
                  <div class="grid1-x grid-margin-x">
                    <div class="small-12 small-offset-0 medium-6 medium-offset-0 large-5 large-offset-1 cell">
                      <div if:true={ImageUrl}>
                        <p class="product-photo">
                          <img src={ImageUrl}>
                        </p>
                      </div>
                      <div if:false={ImageUrl}>
                        <p class="product-photo">
                          <img src={productimage}>
                        </p>
                      </div>
                      <div class="large-5 large-offset-1 cell remove-link-large">
                        <p class="margin-top hide-for-small-only">
                          <a class="remove-link capitalize remove-product-text" data-open="remove-product-modal"
                            aria-controls="remove-product-modal" aria-haspopup="true" tabindex="0"
                            data-value={urlStateParameters.c__assetrecordId} onclick={openModal}>
                            <lightning-icon icon-name='utility:close' alternative-text='close' size='xx-small'
                              title='close'></lightning-icon>Remove This Product from My
                            Account
                          </a>
                        </p>
                      </div>
                    </div>
                    <div
                      class="small-11 small-offset-1 medium-6 medium-offset-0 large-5 large-offset-1 cell1 large-text-left large-text-left-custom">
                      <!-- product description -->
                      <div if:true={Description}>
                        <h2 class="other-h2 product-sku capitalize left">
                          {Description}
                        </h2>
                      </div>
                      <div if:false={Description}>
                        <h2 class="other-h2 product-sku capitalize left">
                          {AppName}
                        </h2>
                      </div>
                      <!-- productmodel number -->
                      <p class="product-name capitalize">
                        {modelNo}
                      </p>
                      <div if:true={review_links}>
                        <p class="write-a-review">
                          <a target="_blank" class="product-sku" href={review_links}>write a review</a>
                        </p>
                      </div>
                      <ul class="support-links">
                        <div if:true={ShowLinks}>
                          <div if:false={Ductless}>
                            <div if:true={ProdSpecs}>
                              <li>
                                <lightning-icon class="icons" icon-name="utility:edit" alternative-text="pencil-alt"
                                  title="pencil-alt"></lightning-icon>
                                <a class="product-sku" href={ProdSpecs} target="_blank">
                                  Product Specs
                                </a>
                              </li>
                            </div>
                          </div>
                          <div if:true={OwnerManualLink}>
                            <li>
                              <lightning-icon class="icons" icon-name="utility:page" alternative-text="edit"
                                title="edit"></lightning-icon>
                              <a class="product-sku" href={OwnerManualLink} target="_blank">
                                Owner's Manual
                              </a>
                            </li>
                          </div>
                          <div if:true={Partslink}>
                            <li>
                              <lightning-icon class="icons" icon-name="utility:custom_apps"
                                alternative-text="pencil-alt" title="pencil-alt"></lightning-icon>
                              <a class="product-sku" href={Partslink} target="_blank">
                                Parts &amp; Accessories
                              </a>
                            </li>
                          </div>
                        </div>
                        <div if:true={showScheduleUrl}>
                          <div if:true={ScheduleServiceLink}>
                            <li>
                              <lightning-icon class="icons" icon-name="utility:date_input" alternative-text="pencil-alt"
                                title="pencil-alt"></lightning-icon>
                              <a class="product-sku" href={ScheduleServiceLink} target="_blank">
                                Schedule service
                              </a>
                            </li>
                          </div>
                        </div>
                        <div if:true={ownerUrl}>
                          <li>
                            <lightning-icon class="icons" icon-name="utility:help" alternative-text="form" title="Form">
                            </lightning-icon>
                            <a class="product-sku" href={ownerUrl} target="_blank">
                              Owner Support
                            </a>
                          </li>
                        </div>
                      </ul>
                    </div>
                  </div>

                  <!-- remove products block -->
                  <div class="grid1-x grid-margin-x">
                    <div class="large-5 large-offset-1 cell remove-link-small">
                      <p class="margin-top hide-for-small-only">
                        <a class="remove-link capitalize remove-product-text" data-open="remove-product-modal"
                          aria-controls="remove-product-modal" aria-haspopup="true" tabindex="0"
                          data-value={urlStateParameters.c__assetrecordId} onclick={openModal}>
                          <lightning-icon icon-name='utility:close' alternative-text='close' size='xx-small'
                            title='close'></lightning-icon>Remove This Product from My
                          Account
                        </a>
                      </p>
                    </div>
                  </div>
                  <!-- end of remove block -->
                </section>
              </div>
            </div>
          </div>
          <!-- modal details -->
          <template if:true={showModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-01" aria-modal="true"
              aria-describedby="modal-content-id-1">
              <div class="reveal-overlay1">
                <div class="reveal1 add-address-modal1" id="modal-01">
                  <div class="close-button">
                    <lightning-icon icon-name='utility:close' alternative-text='close' size='x-small'
                      onclick={closeModal} title='close'></lightning-icon>
                  </div>
                  <h2 class="text-center fontcolor">Remove Products</h2>
                  <div class="delete-message">
                    <div class="removeproduct">
                      <p>
                        Remove Product will delete them permanently from your account
                      </p>
                    </div>
                  </div>
                  <footer>
                    <div class="button-action">
                      <div class="modalbtndiv">
                        <button class="cancleButton1" name="Cancel" onclick={closeModal}>Cancel</button>
                      </div>
                      <div class="modalbtndiv">
                        <button class="okButton" value={urlStateParameters.c__assetrecordId} name="OK"
                          onclick={handledelete}>OK</button>
                      </div>
                    </div>
                  </footer>
                </div>
              </div>
            </section>
          </template>
          <!-- end of modal -->
          <!-- more about information header -->
          <div class="field-wrapper callout-title-container Haier-Monogram-only">
            <div class="title-bar-circles-left"></div>
            <div class="field-items callout-title-inner-container">
              <div class="field-item">
                <h3>{more_info}</h3>
              </div>
            </div>
            <div class="title-bar-circles-right"></div>
          </div>
          <!-- additional information -->
          <div class="more-about-your-appliance-section-container">
            <div class="grid-container">
              <div class="grid1-x .grid-padding-x background">
                <div class="medium-offset-1 medium-10 cell">
                  <section class="more-about-your-appliance-section-">

                    <!-- start -->
                    <div class="more-about-your-appliance1">
                      <div class="grid2-x grid-padding-x border-top">
                        <div class="medium-6 medium-offset-0 cell more-about-subsection appliance-model-serial">
                          <h3 class="other-h3-c">
                            <!-- Model Number -->
                            {model_No_Header}
                          </h3>
                          <p class="model-number">
                            {modelNo}
                          </p>
                          <hr
                            class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">
                          <div class="serial-number-viewing" style="display: block;">
                            <h3 class="other-h3-c">
                              <a class="show-for-small-only edit-link edit-serial-number-link"
                                title="Edit Serial Number">
                                <span class="show-for-GE-only"><br><br></span>
                              </a>
                              <!-- Serial Number -->
                              {serial_No_Header}
                              <lightning-icon style="padding-left:5px" icon-name='utility:edit' alternative-text='edit'
                                size='xx-small' onclick={editSerialNoHandler} title='Edit Serial Number'>
                              </lightning-icon>
                            </h3>

                            <template if:false={showSerialNoForm}>
                              <p class="serial-number">
                                <!-- serial number -->
                                {assetDetails.data.fields.SerialNumber.value}
                              </p>
                            </template>
                            <!-- if edit serial number is true -->
                            <template if:true={showSerialNoForm}>
                              <div class="serial-number-editing">
                                <form class="margin-top-half margin-bottom-1">
                                    <lightning-input type="text" name="serialNumber" pattern={serialNumberPattern} class="validate text-h" required
                                    value={assetDetails.data.fields.SerialNumber.value}
                                    message-when-pattern-mismatch={serialNumberValidationMessage}
                                    message-when-too-short={serialNumberValidationMessage} 
                                    message-when-too-long={serialNumberValidationMessage}
                                    message-when-value-missing={serialNumberValidationMessage}
                                    min-length="6" max-length="18"
                                    placeholder="Enter Serial Number" onchange={serialNumberHandler}></lightning-input>
                                  <input type="hidden" name="c__assetrecordId" id="c__assetrecordId" value={AssetId}>
                                  <!-- <input type="hidden" name="c__assetrecordId" id="c__assetrecordId" value={AssetId}> -->
                                    <div class="button-group expanded margin-bottom-1">
                                    <button class="button primary uppercase" onclick={closeFormHandler}>Cancel</button>
                                    <button class="button secondary uppercase" onclick={SaveSerial}>Save</button>
                                  </div>
                                </form>
                              </div>
                            </template>
                            <!-- end of edit serial form -->
                            <!-- nickname section -->
                            <hr
                              class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">
                          </div>
                        </div>
                        <div
                          class="medium-6 medium-offset-0 small-8 small-offset-2 cell more-about-subsection location-installation">
                          <h3 class="other-h3-c">
                            <!-- Location  -->
                            {location_Header}
                            <a class="hide-for-small-only edit-link edit-location-link" data-open="edit-location-modal"
                              title="Edit Location" aria-controls="edit-location-modal" aria-haspopup="true"
                              tabindex="0"></a>
                            <lightning-icon style="padding-left:5px" icon-name='utility:edit' alternative-text='edit'
                              size='xx-small' onclick={locationUpHandler} title='Edit Serial Number'></lightning-icon>
                          </h3>
                          <template if:false={addForm}>
                            <p class="locdetails">
                              <template if:true={Location_Details}>
                                <div>{Location_Details.Account__r.BillingStreet},</div>
                                <div>
                                  {Location_Details.Account__r.BillingCity},{Location_Details.Account__r.BillingState}&nbsp;{Location_Details.Account__r.BillingPostalCode}
                                </div>
                              </template>
                            </p>
                          </template>
                          <template if:true={addForm}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-01" aria-modal="true"
                              aria-describedby="modal-content-id-1">
                              <div class="reveal-overlay1">
                                <div class="reveal add-address-modal1" id="modal-content-id-1">
                                  <header class="slds-modal__header no-border">
                                    <div class="close-button1">
                                      <lightning-icon class="close-button" icon-name='utility:close'
                                        alternative-text='close' size='x-small' onclick={closeLocationHandler}
                                        aria-modal="false" title='close'></lightning-icon>
                                    </div>
                                    <h3 class="text-center font-primary">Edit Address</h3>
                                  </header>
                                  <div class="select-add-border">
                                    <p>Select an existing address tied to your account.</p>
                                    <label>
                                      <span>Select Address</span>
                                      <lightning-combobox class="select-box" variant="label-hidden" name="Address"
                                        placeholder="Select Address" onchange={UpdAddressHandler}
                                        options={selectOptions}></lightning-combobox>
                                    </label>
                                  </div>
                                  <h3 class="or-div text-center font-primary">OR</h3>
                                  <div class="new-add-border">
                                    <p>Enter a new address where the product is located.</p>
                                    <form class="add-address-form">
                                      <label>
                                        <span>{Address}</span>
                                        <lightning-input type="text" variant="label-hidden" required="required"
                                          maxlength="40" message-when-pattern-mismatch={addressPatternValidationMessage}
                                          pattern={addressFieldPattern} class="validate" disabled={disableAddress}
                                          onchange={AddressHandle}>
                                        </lightning-input>
                                      </label>
                                      <label>
                                        <span>{City}</span>
                                        <lightning-input type="text" variant="label-hidden" required="required"
                                          maxlength="25" message-when-pattern-mismatch={addressPatternValidationMessage}
                                          pattern={addressFieldPattern} class="validate" disabled={disableAddress}
                                          onchange={CityHandler}>
                                        </lightning-input>
                                      </label>
                                      <label>
                                        <span>{State}</span>
                                        <lightning-combobox variant="label-hidden" onchange={StateHandler}
                                          options={stateOptions} required="required" class="validate"
                                          disabled={disableAddress}></lightning-combobox>
                                      </label>
                                      <label>
                                        <span>{Zip_code}</span>
                                        <lightning-input type="text" variant="label-hidden" required="required"
                                          class="validate" disabled={disableAddress} onchange={CodeHandler}
                                          maxlength="5" pattern={zipCodePattern}
                                          message-when-pattern-mismatch={zipCodePatternValidationMessage}></lightning-input>
                                      </label>
                                      <label>
                                        <span>{NickName}</span>
                                        <lightning-input type="text" variant="label-hidden" 
                                          class="validate" disabled={disableAddress} onchange={AddNameHandler}>
                                        </lightning-input>
                                      </label>
                                      <input type="hidden" name="c__assetrecordId" value={AssetId}>
                                      <br>
                                    </form>
                                  </div>
                                  <footer>
                                    <div class="button-group expanded margin-bottom-1">
                                      <button class="button secondary uppercase" onclick={addressHandler}>UPDATE
                                        ADDRESS</button>
                                    </div>
                                    <div class="disclaimer-block">
                                      <p class="disclaimer text-center">
                                        We take your privacy seriously. All information you provide shall be held in
                                        strict accordance with
                                        the <a style="text-decoration:underline" target="_blank"
                                          href="http://www.geappliances.com/privacy/privacy_policy.htm">GE
                                          Appliances privacy policy</a>.
                                      </p>
                                    </div>
                                  </footer>

                                </div>
                              </div>
                            </section>
                          </template>
                          <hr
                            class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">
                          <h3 class="other-h3-c">
                            <!-- Installation Date -->
                            {install_date}
                          </h3>
                          <p class="install-date left">
                            <!-- if it's a valid model -->
                            {assetDetails.data.fields.InstallDate.value}
                            <!-- else /* if it's NOT a valid model */ -->

                          </p>
                          <hr
                            class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">
                        </div>
                      </div>
                    </div>
                    <!--stop-->

                    <!-- nickname section -->
                    <div class="more-about-your-appliance1">
                      <div class="grid1-x grid-padding-x border-top">
                        <div class="medium-6 medium-offset-0 cell more-about-subsection appliance-model-serial">
                          <template if:false={AppName}>
                            <div class="serial-number-viewing" style="display: block;">
                              <h3 class="other-h3-c">
                                <a class="show-for-small-only edit-link edit-serial-number-link"
                                  title="Enter Nick Name">
                                  <span class="show-for-GE-only"><br><br></span>
                                </a>
                                Appliance Nick Name
                              </h3>
                              <div class="nick-name-text">You can create a nickname for your appliance, for example,
                                Basement Refrigerator.</div>
                              <form class="margin-top-half margin-bottom-1">
                                <input type="text" name="NickName" onkeyup={nameHandler}>
                                <input type="hidden" name="c__assetrecordId" value={AssetId}>
                                <div class="button-group expanded margin-bottom-1">
                                  <button class="button secondary uppercase" onclick={setNickNameHandler}>SAVE
                                    NICKNAME</button>
                                </div>
                              </form>
                            </div>
                          </template>
                          <template if:true={AppName}>
                            <div class="serial-number-viewing" style="display: block;">
                              <h3 class="other-h3-c">
                                <a class="show-for-small-only edit-link edit-serial-number-link"
                                  title="Enter Nick Name">
                                  <span class="show-for-GE-only"><br><br></span>
                                </a>
                                <!-- Appliance Nick Name -->
                                {NickName_Header}
                                <lightning-icon style="padding-left:5px" icon-name='utility:edit'
                                  alternative-text='edit' size='xx-small' onclick={UpNickNameHandler}
                                  title='Edit NickName'></lightning-icon>
                              </h3>
                              <template if:false={nickNameForm}>
                                <p class="NickName left">
                                  {AppName}
                                </p>
                              </template>
                              <template if:true={nickNameForm}>
                                <form class="margin-top-half margin-bottom-1">
                                  <input type="text" name="NickName" value={AppName} onkeyup={nameHandler}>
                                  <input type="hidden" name="c__assetrecordId" value={AssetId}>
                                  <div class="button-group expanded margin-bottom-1">
                                    <button class="button secondary cancel-button uppercase"
                                      onclick={CloseNickNameHandler}>Cancel</button>
                                    <button class="button primary uppercase" onclick={updateNickName}>Update</button>
                                  </div>
                                </form>
                              </template>
                            </div>
                          </template>

                          <hr
                            class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">

                        </div>
                        <!-- Warranty Details -->
                        <div
                          class="medium-6 medium-offset-0 small-8 small-offset-2 cell more-about-subsection location-installation">
                          <div style="text-align: left;">
                            <h3 class="other-h3-c">
                              {Warranty}
                            </h3>
                            <div if:true={isConsumerReady}>
                              <div if:true={LaborWarranty}>
                                <p class="warranty-subHeading">{Labor_Warranty} </p><br>
                                <template for:each={LaborWarranty} for:item="LWarr">
                                  <div key={LWarr}>
                                    <p class="warranty-subDetails">
                                      {LWarr}
                                    </p><br>
                                  </div>
                                </template>
                              </div><br>
                              <div if:true={PartsWarranty}>
                                <p class="warranty-subHeading-o">{Parts_Warranty} </p><br>
                                <template for:each={PartsWarranty} for:item="PWarr">
                                  <div key={PWarr}>
                                    <p class="warranty-subDetails">
                                      {PWarr}
                                    </p><br>
                                  </div>
                                </template>
                              </div><br>
                              <div if:true={WarrantyNotes}>
                                <p class="warranty-subHeading-o">{Warranty_Notes} </p><br>
                                <template for:each={WarrantyNotes} for:item="WarrNotes">
                                  <div key={WarrNotes}>
                                    <p class="warranty-subDetails">
                                      {WarrNotes}
                                    </p><br>
                                  </div>
                                </template>
                              </div>
                            </div>
                          </div>
                          <hr
                            class="small-6 small-offset-3 borderLine borderLine-small-only hide-for-medium-only show-for-small-only">
                        </div>
                      </div>
                    </div>

                    <!-- newly inserted -->
                  </section>
                </div>

              </div>

              <!-- </section> -->
            </div>
          </div>
        </div>
      </div>

      <!-- end of more info about appliance -->
      <!-- parts and accessories header -->
      <div class="field-wrapper callout-title-container Haier-Monogram-only">
        <div class="title-bar-circles-left"></div>
        <div class="field-items callout-title-inner-container">
          <div class="field-item">
            <h3>{RelatedParts}</h3>
          </div>
        </div>
        <div class="title-bar-circles-right"></div>
      </div>
      <!-- end of parts and accessories header -->
      <div class="grid-container">
        <div class="grid1-x grid-margin-x">
          <div class="cell">
            <section class="related-parts-and-accessories-section">
              <p if:true={AllParts}>
                <a target="_blank" href={AllParts}>Shop All
                  Parts &amp; Accessories</a>
              </p>
              <!-- Related parts and accessories section start -->
              <div
                class="related-parts-and-accessories-list slick-slider grid-x grid-margin-x small-up-1 medium-up-2 large-up-4 related-parts-and-accessories-slider no-slick-left-right">
                <template if:true={RelAcc}>
                  <template for:each={RelAcc} for:item="part">
                    <div key={part.PModel}>
                      <div class="related-parts-and-accessories-item">
                        <div class="imagetext">
                          <a class="product1-photo" target="_blank" href={part.Plink}>
                            <img src={part.iLink} width="185" height="193">
                            <div class="text">
                              <p class="product-title">
                                {part.PDes}
                              </p>
                              <p class="go-to-part">
                                <button value={part.Plink} onclick={redirectlink} class="RelPartButton">Go To
                                  Part</button>
                              </p>
                            </div>
                          </a>
                        </div>
                      </div>
                    </div>
                  </template>
                </template>
                <!--end of cell -->
              </div>
              <!-- ends .cell.related-parts-and-accessories-item -->
            </section>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
