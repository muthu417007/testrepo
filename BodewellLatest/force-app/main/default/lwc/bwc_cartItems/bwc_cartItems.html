    <template if:true={_memberSKU}>
        <lightning-card class="card">

                            <template if:true={cartItem.ProductDetails.fields.BWC_Main_Image__c}>
                                <img src={cartItem.ProductDetails.fields.BWC_Main_Image__c}

                            </template>
                        </div>
                    </div>
                    <div class="slds-size_10-of-12">
                        <div class="slds-grid member-pr-label">
                            <div class="content slds-size_6-of-12">
                                <div class="title slds-m-around_x-small">
                                    {cartItem.ProductDetails.name}

                                    <div class="multiline-text">
                                        One Year Bodewell Membership Includes <br>
                                        discounts on products, parts, <br>
                                        service and delivery
                                    </div>

                                </div>
                            </div>
                            <div class="slds-size_3-of-12">
                                <div class="memberPrice slds-m-around_x-small">
                                     <strong> ${cartItem.price} </strong> 
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="close slds-size_1-of-12">
                        <lightning-icon icon-name="action:close" alternative-text="Close" title="Close" size="xx-small"
                            data-id={cartItem.id} onclick={clearCartItem}></lightning-icon>

                </div>
            </template>

        </lightning-card>
    </template>
