<template>

    <template if:true={loading}>
        <lightning-spinner alternative-text="Loading" size="large" variant="brand"
            class="slds-m-top_large"></lightning-spinner>
    </template>

    <template if:true={isPDPPage}>
        <c-bwc_product-savings-member-p-d-p onopenmodal={handleOpenModal}></c-bwc_product-savings-member-p-d-p>
    </template>

    <template if:true={isAnotherPage}>
        <div class="banner slds-align_absolute-center">
            <template lwc:if={bannerFlag}>
                <p class="title-join dxp-text-heading-xsmall"> Become a Bodewell member and save up to  &nbsp;
                <lightning-formatted-number                   
                    value={memberSavings}
                    maximum-fraction-digits="2"
                    currency-code={currencyCode}
                    format-style="currency">
                </lightning-formatted-number> &nbsp;
                    today!
                    <a onclick={handleJoinNow} class="slds-p-left_xx-small slds-text-link join"> &nbsp;Join Now</a>
                </p>
            </template>
            <template lwc:else>
                <p class="title dxp-text-heading-xsmall"> Become a Bodewell member to receive exclusive savings and
                    benefits.
                    <a onclick={handleJoinNow} class="slds-p-left_xx-small slds-text-link">
                        <span class="join"> Learn More </span>
                    </a>
                </p>
            </template>
        </div>
    </template>
