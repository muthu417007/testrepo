                        <td class="features-data">{applianceTypeLabel}</td>
                      </tr>
                      <tr class="slds-col slds-p-around_small">
                        <th class="type-header">Model</th>
                        <td class="features-data">{model}</td>
                      </tr>
                      <tr class="slds-col slds-p-around_small">
                        <th class="type-header">Mkt. Model</th>

                      </tr>
                      <tr class="slds-col slds-p-around_small">
                        <th class="type-header">Serial</th>
                        <td class="features-data">{serial}</td>
                      </tr>
                    </table>
                    
                  </div>
                  <div class="slds-col">
                      <div class="type-header">Features</div>
                      <div class="slds-scrollable_y">
                        <template for:each={equipmentFeatures} for:item="featureitem" for:index="index">
                          <div class="slds-p-around_small" key={featureitem.label}>
                            <div class="features-data">{featureitem.feature}</div>
                          </div>
                        </template>
      
                      </div>
                      
                  </div>

              <template if:true={imageview}>

                      <div class="container">

                        <a class="prev" onclick={movePrevious}>❮</a>
