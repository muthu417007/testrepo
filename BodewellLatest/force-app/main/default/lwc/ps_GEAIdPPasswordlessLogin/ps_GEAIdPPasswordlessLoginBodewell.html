<template>
    <div class="outer-container">
        <div class="spinner">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
            </template>
        </div>

        <div class="idp-page-title slds-m-bottom_x-small">
            <div class="slds-text-heading_medium">
                <b>
                        {pageTitleLabel}
                 </b>
            </div>           
        </div>
        <template if:false={showEnterPasscode}>
        <p class="idp-page-text">
          <b>  {pageTitleDescriptionLabel1} <br> {pageTitleDescriptionLabel2}   </b>
        </p>
       </template>

        <div class="idp-form">
            <template if:true={showEnterPasscode}>
                <div class="enter-passcode-container slds-m-top_x-small slds-m-bottom_medium">

                    <div class="idp-page-text">
                     <div style="width: 1000px;">   {pageTitleDescriptionLabel} </div>
                    </div>
                    <div class="slds-text-heading_medium">
                       <b> {pageSubTitleLabel} </b>
                    </div>
                    <p class="idp-page-text">
                        {pageSubTitleDescriptionLabel}
                    </p>

                    <template if:true={showSubmitError}>
                        <div class="generalErrorClass slds-m-bottom_medium">
                            {unableToSubmitCode}
                        </div>
                    </template>

                    <div class="passcode-input">
                      <!--  <label class="slds-form-element__label idp-label">
                            {passcodeLabel}
                        </label>  
                    
                    
                        <div class="otp-field">
                            <input type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput}  />
                            <input type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput} />
                            <input class="space" type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput} />
                            <input type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput} />
                            <input type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput} />
                            <input type="text" maxlength="1" onchange={handlePasscodeChange} required="" onkeyup={onKeyUpCodeInput} />
                            
                        </div>
                    
                    -->


                        <div class="slds-form-element__control form-passcode-input">
                            <input
                                    type="text"
                                    data-id="passcodeInput"
                                    name="passcodeInput"
                                    class="idp-text-input"
                                    onchange={handlePasscodeChange}
                                    required=""
                                    onkeyup={onKeyUpCodeInput}
                            />
                        </div>   
                    </div>
                    <br>
                    <button class="slds-button slds-button_brand button-size"
                            onclick={handleContinue}
                    >
                        {continueButtonLabel}
                    </button>

                    <div class="slds-text-heading_medium">
                        {didntReceiveTheCodeLabel}
                    </div>
                    <p class="idp-page-text slds-m-bottom_small">
                        {didntReceiveTheCodeDescriptionLabel}
                    </p>
                </div>
            </template>

            <template if:true={showRequestError}>
                <div class="generalErrorClass slds-m-bottom_medium slds-text-align_center">
                    {unableToRequestCode}
                </div>
            </template>

            <div class="email-input-container">
                <div class="email-input">
                    <label class="slds-form-element__label idp-label">
                      <b>  {emailMeLabel}  </b>
                    </label>
                    <div class="slds-form-element__control form-email-input">
                        <input
                                type="text"
                                data-id="emailInput"
                                name="emailInput"
                                placeholder="johndoe@johndoe.com"
                                class="idp-text-input"
                                onchange={handleEmailChange}
                                required=""
                                onkeyup={onKeyUpEmailInput}
                                autocapitalize="off"
                        />
                    </div>
                </div>
                <br>
                
                <button class="slds-button slds-button_brand reset-button-container"
                        onclick={handleSendCode}
                >
                    {sendMeACodeButtonLabel}
                </button>
            </div> 

         <!--   <div class="separator idp-separator">

                <div style="position: relative;">
                    <hr style="position: absolute; top: 50%; width: 25%; margin: 0;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;">
                      OR
                    </div>
                    <hr style="position: absolute; top: 50%; left: 60%; width: 25%; margin: 0;">
                  </div></div>

                  <div style="position: relative; text-align: center;">
                    <hr style="width: 40%; display: inline-block;">
                    <div style="display: inline-block; padding: 0 10px;">HTMLL Text</div>
                    <hr style="width: 40%; display: inline-block;">
                  </div>  -->
                  <div class="horizontal-line-container">
                    <hr class="horizontal-line">
                    <div class="text-between-lines"><h5> OR </h5></div>
                    <hr class="horizontal-line">
                  </div>

                <button  class="slds-button slds-button_brand button-size"
                        onclick={handleResetMyPasswordBodewell}
                >
                    {resetMyPasswordButtonLabel}
                </button>
            
        </div>
    </div>
</template>
