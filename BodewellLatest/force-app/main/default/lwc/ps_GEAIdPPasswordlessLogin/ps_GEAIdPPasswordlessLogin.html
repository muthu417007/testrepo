<template>
    <div class="outer-container">
        <div class="spinner">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
            </template>
        </div>

        <p class="idp-page-title slds-m-bottom_x-small">
            {pageTitleLabel}
        </p>
        <p class="idp-page-text">
            {pageTitleDescriptionLabel}
        </p>

        <div class="idp-form">
            <template if:true={showEnterPasscode}>
                <div class="enter-passcode-container slds-m-top_x-large slds-m-bottom_medium">
                    <p class="idp-page-title idp-page-sub-title slds-m-bottom_x-small">
                        {pageSubTitleLabel}
                    </p>
                    <p class="idp-page-text">
                        {pageSubTitleDescriptionLabel}
                    </p>

                    <template if:true={showSubmitError}>
                        <div class="generalErrorClass slds-m-bottom_medium">
                            {unableToSubmitCode}
                        </div>
                    </template>

                    <div class="passcode-input">
                        <label class="slds-form-element__label idp-label">
                            {passcodeLabel}
                        </label>
                        <div class="slds-form-element__control form-passcode-input">
                            <input
                                    type="text"
                                    data-id="passcodeInput"
                                    name="passcodeInput"
                                    class="idp-text-input"
                                    onchange={handlePasscodeChange}
                                    required=""
                                    onkeyup={onKeyUpCodeInput}
                            />
                        </div>
                    </div>

                    <button class="idp-primary-button part-width
                slds-p-around_x-small slds-m-top_medium slds-m-bottom_small"
                            onclick={handleContinue}
                    >
                        {continueButtonLabel}
                    </button>

                    <p class="idp-page-text didnt-got-code slds-m-bottom_xx-small slds-m-top_large">
                        {didntReceiveTheCodeLabel}
                    </p>
                    <p class="idp-page-text slds-m-bottom_small">
                        {didntReceiveTheCodeDescriptionLabel}
                    </p>
                </div>
            </template>

            <template if:true={showRequestError}>
                <div class="generalErrorClass slds-m-bottom_medium slds-text-align_center">
                    {unableToRequestCode}
                </div>
            </template>

            <div class="email-input-container">
                <div class="email-input">
                    <label class="slds-form-element__label idp-label">
                        {emailMeLabel}
                    </label>
                    <div class="slds-form-element__control form-email-input">
                        <input
                                type="text"
                                data-id="emailInput"
                                name="emailInput"
                                class="idp-text-input"
                                onchange={handleEmailChange}
                                required=""
                                onkeyup={onKeyUpEmailInput}
                                autocapitalize="off"
                        />
                    </div>
                </div>

                <button class="idp-primary-button part-width
            slds-p-around_x-small slds-m-top_medium slds-m-bottom_large"
                        onclick={handleSendCode}
                >
                    {sendMeACodeButtonLabel}
                </button>
            </div>

            <div class="separator idp-separator">OR</div>

            <div class="reset-button-container">
                <button class="idp-primary-button part-width
            slds-p-around_x-small slds-m-top_large slds-m-bottom_small"
                        onclick={handleResetMyPassword}
                >
                    {resetMyPasswordButtonLabel}
                </button>
            </div>
        </div>
    </div>
</template>
