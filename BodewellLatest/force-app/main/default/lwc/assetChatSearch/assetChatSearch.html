<template>
    <template if:true={shopPopup}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="close" onclick={closePopup}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>

                    </button>

                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Launch Virtual Assistant
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-grid slds-wrap" style="height: 15rem;">
                        <template if:true={isapicall}>
                            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                          </template>
                        
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                        
                                <lightning-input required class="inputbox" type="text" data-id="reset" data-name="model"
                                     label="Model Number" variant="scoped" value={modelNumber} onchange={handleModelUpdate}
                                    placeholder="Model"></lightning-input>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                        
                                <lightning-input required class="inputbox" type="text" data-id="reset" data-name="serial"
                                     label="Serial Number" variant="scoped" value={serialNumber} onchange={updateSerial}
                                    placeholder="Serial"></lightning-input>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                        
                            <lightning-input required class="inputbox" type="text" data-id="reset" data-name="phone"
                                 label="Phone Number" variant="scoped" value={phoneNumber}
                                placeholder="Phone"></lightning-input>
                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                    
                            <!--<lightning-input required class="inputbox" type="text" data-id="reset" data-name="applianceType"
                                 label="Appliance Type" variant="scoped" value={applianceType}
                                placeholder="Appliance Type"></lightning-input>-->

                                <lightning-combobox required name="Type" label="Appliance Type" value={applianceType}
                                placeholder="Select Appliance" options={applianceTypeValues} data-id="applianceTypeData"
                                onchange={handleapplianceType}></lightning-combobox>

                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                            <lightning-combobox required name="Category" label="Problem Category" value={category}
                                placeholder="Select Problem" options={problemcategory} data-id="selectedProblem"
                                onchange={handleproblemcategory} ></lightning-combobox>

                        </div>
                        <div class="slds-col slds-size_6-of-12 slds-var-p-horizontal_small">
                        
                            <lightning-textarea class="inputbox" type="text" data-id="reset" data-name="description"
                                 label="Describe Appliance Issue" variant="scoped"
                                placeholder="Description"></lightning-textarea>
                        </div>
                        
                               
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button--destructive" aria-label="Cancel and close"
                        onclick={previousScreen}>Cancel</button>

                    <!--<lightning-button variant="brand-outline" label="Get Model/Serial" title="Update Model/Serial" onclick={updateSearchFields} class="slds-m-left_x-small"></lightning-button>-->
   
                    <button class="slds-button slds-button_brand" onclick={launchVa}>Submit</button>
                </div>
            </div>
        </section>
    </template>
</template>
