<template>

    <lightning-card title="Validate/Create Asset" icon-name='utility:products' id="cmpCard">
        
        <div if:true={showSpinner} class="slds-m-around_large">
             <div  class="slds-is-relative">
                <lightning-spinner
                    alternative-text="Loading..." variant="brand">
                </lightning-spinner>
            </div>
        </div>
        
        <div class="slds-grid slds-gutters" style="padding-top: 15px;">
            <div class="slds-col slds-size_1-of-1">
                <span>Asset Information</span>
            </div>
        </div>
        <div class="slds-grid slds-gutters" >
            <div class="slds-col slds-size_1-of-2">
                <lightning-input type="text" label="Model" placeholder="Model"  value={model} onchange={handleModelChange} 
                    disabled={validateButtonDisabled}
                ></lightning-input>        
            </div>
            <div class="slds-col slds-size_1-of-2">
                <lightning-input type="text" label="Serial" placeholder="SerialNumber" value={serial} onchange={handleSerialChange}
                    disabled={validateButtonDisabled}
                ></lightning-input>
            </div>
        </div>
        <div class="slds-grid slds-gutters" >
            <div class="slds-col slds-size_1-of-2">
                <template if:true={inWarrantyPicklist.data}>
                <lightning-combobox name="InWarranty" label="In Warranty" value={inWarrantyValue}
                    options={inWarrantyPicklist.data.values} onchange={handleWarrantyChange} disabled={validateButtonDisabled}> 
                </lightning-combobox>
                </template>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <lightning-input type="Date" label="Installation Date" placeholder=""  value={installDate} onchange={handleInstallDateChange} 
                disabled={validateButtonDisabled}
        ></lightning-input>
            </div>
        </div>
        
        <div class="slds-grid slds-gutters" style="padding-top: 10px;">
            <div class="slds-col slds-size_1-of-4">
                <lightning-button variant="brand-outline" label="Validate" onclick={handleAssetValidate} disabled={validateButtonDisabled} class="slds-m-left_x-small"></lightning-button>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <lightning-button variant="destructive-text" label="Clear" onclick={handleClearAssetFields} disabled={clearButtonsDisabled} class="slds-m-left_x-small"></lightning-button>
            </div>
            <div class="slds-col slds-size_2-of-4">
                <lightning-button variant="brand" label="Create Asset" disabled={createAssetDisabled} onclick={handleAssetCreation} class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
    </lightning-card>    
</template>
