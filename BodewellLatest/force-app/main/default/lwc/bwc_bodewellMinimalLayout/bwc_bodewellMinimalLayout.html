<template>
    <header data-f6-region>
        <span><slot name="Title"></slot></span>
    </header>
    <main data-f6-region>
        <slot></slot>
    </main>
    <template lwc:if={showFooter}>
        <footer data-f6-region>
            <div class="footer-content">
                <div lwc:if={isDesktop}
                    class="commerce-footer-desktop slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_align-center">
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_Customer_Care"></slot>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_My_Bodewell"></slot>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_Our_Company"></slot>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical">
                        <div class="slds-col">
                            <slot name="Footer_Logo"></slot>
                        </div>
                        <div class="slds-col">
                            <slot name="Footer_Social"></slot>
                        </div>
                    </div>
                    <hr>
                    <div class="slds-col slds-size_1-of-1">
                        <slot name="Footer_Copyright"></slot>
                    </div>
                </div>
                <div lwc:if={isMobile}
                    class="commerce-footer-mobile slds-grid slds-wrap">
                    <div class="slds-col slds-grid slds-grid_vertical">
                        <div class="slds-col">
                            <lightning-accordion allow-multiple-sections-open>
                                <lightning-accordion-section name="Customer Care" label="Customer Care">
                                    <slot name="Footer_Customer_Care"></slot>
                                </lightning-accordion-section>
                                <lightning-accordion-section name="My Bodewell" label="My Bodewell">
                                    <slot name="Footer_My_Bodewell"></slot>
                                </lightning-accordion-section>
                                <lightning-accordion-section name="Our Company" label="Our Company">
                                    <slot name="Footer_Our_Company"></slot>
                                </lightning-accordion-section>
                            </lightning-accordion>
                        </div>
                        <div class="slds-col">
                            <slot name="Footer_Logo"></slot>
                        </div>
                        <div class="slds-col">
                            <slot name="Footer_Social"></slot>
                        </div>
                        <hr>
                        <div class="slds-col">
                            <slot name="Footer_Copyright"></slot>
                        </div>
                    </div>
                </div>
                <div lwc:if={isTablet}
                    class="commerce-footer-tablet slds-grid slds-wrap">
                    <div class="slds-col slds-size_2-of-3 slds-grid slds-grid_align-center">
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_Customer_Care"></slot>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_My_Bodewell"></slot>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <slot name="Footer_Our_Company"></slot>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-grid slds-grid_vertical">
                        <div class="slds-col">
                            <slot name="Footer_Logo"></slot>
                        </div>
                        <div class="slds-col">
                            <slot name="Footer_Social"></slot>
                        </div>
                    </div>
                    <hr>
                    <div class="slds-col slds-size_1-of-1">
                        <slot name="Footer_Copyright"></slot>
                    </div>
                </div>
            </div>
        </footer>
    </template>
</template>
