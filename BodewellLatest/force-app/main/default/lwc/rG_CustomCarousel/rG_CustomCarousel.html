<template>
    <!-- Desktop View Starts  -->
    <div class="inner-wrapper-steps ">
        <h3 class="desc-head">HOW GE APPLIANCES FACTORY SERVICE WORKS</h3>
    
    <div class="rg_Desktop_Steps_Section slds-grid slds-wrap inner-wrapper-steps-desc">
        <template for:each={slides} for:item="slide">
            <div key={slide.Heading1__c} class="slds-col slds-large-size_3-of-12 slds-small-size_12-of-12 slds-medium-size_6-of-12 rg_steps_content">

                    <div>
                        <lightning-layout>
                            <lightning-layout-item class="slide-icon-image" size="3">
                                <img src={slide.ImageUrl__c}>
                            </lightning-layout-item>
                            <lightning-layout-item size="9">
                                <div class="carouselHeading1">
                                    {slide.Heading1__c}
                                </div>
                                <div class="carouselHeading2">
                                    {slide.Heading2__c}
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                    <div class="carouselDescription">
                        <lightning-layout>
                            <lightning-layout-item>
                                {slide.Description__c}
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                    <div if:true ={slide.Contact_Number__c} class="slide-contactnumber">
                         <a href={tollfreenumberlink} onclick={handleCall}>{tollfreenumber}</a>
                    </div>
                </div>
            </div>
        </template>
       
    </div>
    </div>
    <div class="fine-print">
        <span>
            {RG_Disclaimer_Text}
        </span>
    </div>
