<template lwc:render-mode="light">
    <div class="facet-header">
        <h4 class="facet-name">{name}</h4>
        <figure>
            <lightning-button-icon
                icon-name={iconName}
                alternative-text={facetToggleLabel}
                class="expand-button slds-m-right_x-small"
                variant="bare"
                icon-class="slds-m-around_xsmall"
                size="small"
                onclick={handleFacetHeaderToggle}
                aria-expanded={_expanded}></lightning-button-icon>
        </figure>
    </div>
    <div
        class="facet-body"
        role="group">
        <template lwc:if={rating}>
            <c-bwc_show-rating-on-filter
            if:false={isDateTimeOrSlider}
            facet-name={name}
            values={values}
            type={type}
            class={facetDisplayClasses}
            onfacetvaluetoggle={handleFacetToggle}>            
            </c-bwc_show-rating-on-filter>
        </template>
        
        <template lwc:else>
            <c-bwc_search-input-facet
                if:false={isDateTimeOrSlider}
                facet-name={name}
                values={values}
                type={type}
                class={facetDisplayClasses}
                onfacetvaluetoggle={handleFacetToggle}>
            </c-bwc_search-input-facet>

            <c-bwc_search-slider-facet
                if:true={isSlider}
                min={minValue}
                max={maxValue}
                class={facetDisplayClasses}
                onfacetvaluetoggle={handleFacetToggle}></c-bwc_search-slider-facet>
        </template>
    </div>
</template>
