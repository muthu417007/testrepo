<template>

    <template if:false={loading}>

        <template if:true={active}>
            <div class="tooltip">
                <div class="top">
                    
                    <lightning-icon 
                        onclick={close}
                        class="close"
                        icon-name="utility:close"
                        alternative-text="Close"
                        size="small"
                    ></lightning-icon>

                    <h1>Order Number: {value}</h1>
                    
                    <br />

                    <b>Details</b>
                    <table class="slds-table">
                        <thead>
                            <th>Freight Code</th>
                            <th>Summary Status</th>
                            <th>Tracking #</th>
                            <th>Carrier Code</th>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{data.ORDER_HEADER.FREIGHT_CODE}</td>
                                <td>{data.ORDER_HEADER.ORDER_HDR_SUMMARY_STATUS}</td>
                                <td>{data.ORDER_HEADER.TRACKING_NO}</td>
                                <td>{data.ORDER_HEADER.TYPE_ORDER}</td>
                            </tr>
                        </tbody>
                    </table>

                    <br />

                    <b>Order Lines</b>
                    <table class="slds-table">
                        <thead>
                            <th>Invoice Line</th>
                            <th>Part #</th>
                            <th>Part Desc</th>
                            <th>Manufacturer Cost</th>
                            <th>Discount %</th>
                            <th>Job Code</th>
                            <th>Job Code Desc</th>
                            <th>Net Line Value</th>
                            <th>Ship Date</th>
                        </thead>
                        <tbody>
                            <template for:each={data.ORDER_LINES} for:item="line" >
                                <tr key={line.ITEM_ID}>
                                    <td>{line.ORDER_LINE}</td>
                                    <td>{line.ITEM_ID}</td>
                                    <td>{line.ITEM_DESCRIPTION}</td>
                                    <td>{line.COST}</td>
                                    <td>{line.DISC_PC}</td>
                                    <td>{line.CSN_JOB_CODE}</td>
                                    <td>{line.JOB_CODE_DESCRIPTION}</td>
                                    <td>{line.LINE_PRICE}</td>
                                    <td>{line.SHIP_DATE}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <hr></hr>
                    
                    <lightning-button 
                        label="Close"
                        onclick={close}
                    ></lightning-button>

                    <i></i>
                </div>
            </div>
        </template>
        
        <div onclick={show}>
            <a>{value}</a>
        </div>
    </template>

    <template if:true={loading}>
        <div class="exampleHolder">
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
    </template>
</template>
