<template lwc:render-mode="light">
    <lightning-input label={value.name} 
        variant="label-hidden" 
        type={type} 
        checked={value.checked}
        onclick={handleFacetValueToggle} 
        onkeyup={handleKeyPress} 
        data-id={value.id} 
        data-checked={value.checked}
        data-displayname={value.name}></lightning-input>
    <!-- Note: Adding the label outside since the lightning-input label is
        not truncating based on it's container. The screen reader still picks
        the internal label for accessibility, so we are adding a span with title
        for every other scenarios. -->
    <span class="slds-form-element__label slds-truncate" aria-hidden="true">
        <!-- {value.name} -->
        <span class="showStarsWrapper">
            <span class={showStars}>
                <template for:each={filledStars} for:item="filledStar">
                    <span key={filledStar}>
                        <lightning-icon 
                            icon-name="utility:favorite" 
                            size="x-small" 
                            alternative-text="Filled Star"
                            title="Filled Star" 
                            class="filledStar">
                        </lightning-icon>
                    </span>
                </template>
                <template for:each={emptyStars} for:item="emptyStar">
                    <span key={emptyStar}> 
                        <lightning-icon 
                            icon-name="utility:favorite" 
                            size="x-small"
                            alternative-text="Empty Star"
                            title="Empty Star" 
                            class="emptyStar">
                        </lightning-icon>
                    </span>
                </template>
            </span>
        </span>
        <span>{showValueAfterStars}</span>
    </span>
</template>
