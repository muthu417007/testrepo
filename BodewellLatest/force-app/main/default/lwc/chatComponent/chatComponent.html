<template>
    <div class="chat_gridmargin">
    <lightning-card title="CHATBOT" icon-name="standard:live_chat" label="Chat" class="lgc-bg">

        <div data-scroll-area class="slds-scrollable_y" style="height: 56vh;">
            <template if:true={isapidatacall}>
                <lightning-spinner alternative-text="Loading..." size="large"></lightning-spinner>
              </template>
              
        <section role="log" class="slds-chat">
            <ul class="slds-chat-list">
                <li class="slds-chat-listitem slds-chat-listitem_bookend">
                    <div class="slds-chat-bookend">
                        <span class="slds-icon_container slds-icon-utility-chat slds-chat-icon">
                            <svg class="slds-icon slds-icon_x-small slds-icon-text-default" aria-hidden="true">
                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#chat"></use>
                            </svg>
                        </span>
                        <p>Chat started by
                            <b> -{uname}</b> • {current}
                        </p>
                    </div>
                </li>
                <template for:each={chatdata} for:item="chatrec" for:index="index">
                    <template if:true={chatrec.inbound}>
                        <li key={chatrec.id} data-id={chatrec.id} class="slds-chat-listitem slds-chat-listitem_inbound">
                            <div class="slds-chat-message">
                                <span aria-hidden="true" class="slds-avatar slds-avatar_circle slds-chat-avatar">
                                    <abbr class="slds-avatar__initials slds-avatar__initials_inverse"
                                        title="Virtual Assistant">VA</abbr>
                                </span>
                                <div class="slds-chat-message__body">
                                    <div class="slds-chat-message__text slds-chat-message__text_inbound">

                                        <span> <div class="chat-msg">
                                            <lightning-formatted-rich-text value={chatrec.msg}>
                                                </lightning-formatted-rich-text>
                                            </div>
                                            <template if:true={chatrec.attachmentFlag}>
                                                <div class="slds-m-around_small">
                                                    <b> Attachment : </b>
                                                      <a class="link icon-help" href={chatrec.attachment}
                                                        target="_blank">
                                                        <h3>{chatrec.attachmentName}</h3>
                                                      </a>
                                                    
                                                  </div>
                                                </template>
                                            <br>
                                            <template if:true={chatrec.data}>

                                                <template for:each={chatrec.data} for:item="recorddata" for:index="index">
                                                    <!--<span key={recorddata.value} class="slds-m-left_x-small slds-m-bottom_x-small">
                                                    <lightning-button disabled={chatrec.isbuttondisabled} variant="brand" label={recorddata.label} value={recorddata.value} title={recorddata.childId} onclick={getUserSelectedProblem}></lightning-button>
                                                    </span>-->
                                                    <button key={recorddata.value} class="slds-button slds-button_brand slds-m-bottom_small slds-m-left_x-small" disabled={chatrec.isbuttondisabled} label={recorddata.label} value={recorddata.value} title={recorddata.childId} onclick={getUserSelectedProblem}>
                                                        
                                                        <lightning-formatted-rich-text style="padding-top:5px;padding-bottom:5px;" value={recorddata.label} title={recorddata.childId}>
                                                        </lightning-formatted-rich-text>
                                                    </button>
                                                    
                                                </template>
                                            </template>
                                           
                                        </span>
                                    </div>
                                    <!--<div class="slds-chat-message__meta" aria-label="said Andy Martinez at 4:59 PM">
                                        virtual assistant • {current}
                                    </div>-->
                                    </div>
                            </div>
                        </li>
                    </template>
                    <template if:false={chatrec.inbound}>
                        <li key={chatrec.id} data-id={chatrec.id} class="slds-chat-listitem slds-chat-listitem_outbound">
                            <div class="slds-chat-message">
                                <div class="slds-chat-message__body">
                                    <div class="slds-chat-message__text slds-chat-message__text_outbound">
                                        <span><lightning-formatted-rich-text value={chatrec.data.label}></lightning-formatted-rich-text></span>
                                    </div>
                                    <div class="slds-chat-message__meta" aria-label="said Jason Dewar at 5:02 PM">{uname} •
                                        {current}</div>
                                </div>
                            </div>
                        </li>
