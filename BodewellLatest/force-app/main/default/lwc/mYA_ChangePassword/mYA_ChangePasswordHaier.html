<template>
    <div class="c-container">
      <div class="center">
    <h1 class="primary-color header-title">Change Your Password</h1>
    <div class="containers">
      <div class="slds-form-element">
          <label class="slds-form-element__label">Old Password <abbr title="required" class="slds-required">*</abbr></label>
          <br/>
          <div class="slds-form-element__control">
            <lightning-input type="password"   class="selector"  label="Old Password"     variant="label-hidden" name="oldPass" onchange={handleChange}></lightning-input>
          </div>
        </div>
        <br/>
        <div class="slds-form-element ">
          <label class="slds-form-element__label" >New Password <abbr title="required" class="slds-required">*</abbr></label>
          <p class="input-box-text">Your password must include at least 8 characters, 1 letter and 1 number</p>
          <div class="slds-form-element__control">
            <lightning-input type="password"  class="selector"  label="New Password"    variant="label-hidden" name="newPass" onchange={handleChange}></lightning-input>
          </div>
        </div>
        <br/>
        <div class="slds-form-element ">
          <label class="slds-form-element__label" >Reenter New Password <abbr title="required" class="slds-required">*</abbr></label>
          <div class="slds-form-element__control">
            <lightning-input type="password"   class="selector"  label="Re-Enter New Password"    variant="label-hidden" name="rePass" onchange={handleChange}></lightning-input>
          </div>
        </div>
        <br/>
        <br/>
      <div class="appliance-btn">
            <button class="continuebtn idp-primary-button"  name="Continue" onclick={handleContinue}>Update Password</button>
            <br/> 
        </div>
        
      </div>
  </div>
  <template if:true={isMess}>
    <p style="color:red;">{Message}</p>
  </template>
 
      </div>
  </template>
