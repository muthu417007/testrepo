<template>
    <div class="container background-set" data-id="bgDiv">
        <template if:true ={lefttext}>
        <div class="slds-grid slds-wrap text-banner align-text">
            <div class="slds-col mob-content tab-content slds-size_7-of-12 text-content">
                <h1 class="container-text">{titleonimage}</h1>
                <h3 class="subtitle-text">{subtitle}</h3>
                <a href={redirectURL} onclick={handleClick}>
                    <span  class="generic-button tertiary-transparent">{buttontext}</span>
                </a>
            </div>
            <div class="slds-col mob-content2 tab-content slds-size_5-of-12">
            </div>
        </div>
        </template>
<template if:true={righttext}>
            <div class="slds-grid slds-wrap text-banner align-text">
                <div class="slds-col mob-content2 tab-content slds-size_5-of-12"></div>
                <div class="slds-col mob-content tab-content slds-size_7-of-12 text-content">
                    <h1 class="container-text">{titleonimage}</h1>
                     <h3 class="subtitle-text">{subtitle}</h3>
                     <a href={redirectURL} onclick={handleClick}>
                        <span  class="generic-button tertiary-transparent">{buttontext}</span>
                    </a>
                </div>
            </div>
        </template>
<template if:true={centertext}>
        <div class="slds-grid slds-wrap text-banner align-text ">
            <div class="slds-col mob-content-center tab-content-center slds-size_2-of-12">
                <span></span>
            </div>
            <div class="mob-content-center tab-content-center slds-size_8-of-12 text-content center-text-div">
                <h1 class="container-text">{titleonimage}</h1>
                <h3 class="subtitle-text">{subtitle}</h3>
                <a href={redirectURL} onclick={handleClick}>
                    <span  class="generic-button tertiary-transparent">{buttontext}</span>
                </a>
            </div>
            <div class="slds-col mob-content-center tab-content-center slds-size_2-of-12">
              <span></span>
            </div>
          </div>
          </template>
</div>
<!--end of file-->
</template>
