<template>
    <ul class="brand-nav-row">
        <template for:each={options} for:item="option">
            <li key={option.value} data-id={option.value} class="brand-nav-item">
                <a href={option.url} title={option.title}>
                    <img src={option.img} alt={option.title}>
                    <div class="brand-nav-text-container">
                        <span>{option.label}</span>
                    </div>
                </a>
            </li>
        </template>
    </ul>
</template>
