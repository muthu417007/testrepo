<template>
    <lightning-card>
        <div class="slds-grid slds-align_absolute-center container">
            <div class="slds-col slds-large-size_6-of-12">
                <h3><b>Select a Store</b></h3>
                <lightning-combobox label="Store" name="Store" value={selectedStore} options={availableStore} onchange={handleStoreChange} class="slds-m-top_large store"></lightning-combobox>
                <lightning-combobox label="User" name="User" value={selectedUser} options={availableUsers} onchange={handleUserChange} class="slds-m-top_large user"></lightning-combobox>
                <lightning-input label="ZipCode" name="zipCode" value={enterZipCode} onchange={handleZipChange} class="slds-m-top_large user"></lightning-input>
            </div>
            <div class="slds-m-top_x-large slds-m-bottom_x-large button">
                <lightning-button label="Next" variant="brand" onclick={handleNextClick}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
