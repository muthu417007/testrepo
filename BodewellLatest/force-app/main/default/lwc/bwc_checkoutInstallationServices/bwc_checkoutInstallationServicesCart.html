<template>
    <template if:true={isLoading}>
        <div class="demo-only" style="height:6rem;position:relative">
            <div class="slds-spinner_container">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>
    </template>
    <template if:false={isLoading}>
    <template if:true={installationFlag}>
        <div class="productView-services-main">

            <div class="d-flex align-items-top justify-content-spaceBetween">
                <div>
                    <h2 class="productView-services-title-main">
                        <span class="icon slds-icon slds-icon_x-small">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
                                <g>
                                    <g class="e">
                                        <g class="e">
                                            <path class="f"
                                                d="m35.23,27.69c1.02,1.03,1.02,2.69,0,3.71l-3.71,3.71c-1.02,1.02-2.68,1.02-3.71,0l-8.23-8.23c-1.63-1.63-1.94-4.05-.98-6l-7.5-7.5h-4.36S0,4.44,0,4.44L4.5,0l8.94,6.75v4.36l7.56,7.5c1.96-.96,4.38-.65,6,.98l8.23,8.1Zm-18.76-1.46l-8.37,8.37c-.93.93-2.14,1.39-3.36,1.39s-2.43-.46-3.35-1.39c-1.85-1.85-1.85-4.86,0-6.71l10.47-10.47,4.16,4.16c-.37,1.58-.17,3.19.45,4.65Zm-10.29,5.26c0-.94-.76-1.69-1.69-1.69s-1.69.75-1.69,1.69.76,1.69,1.69,1.69,1.69-.75,1.69-1.69Zm15.4-15.48l-5.82-5.83c0-.56.01-1.13.12-1.72.62-3.95,3.65-7.25,7.54-8.18,1.68-.4,3.31-.38,4.81-.02.76.18,1.02,1.16.46,1.71l-4.84,4.84v5.25h5.32l4.84-4.84c.56-.56,1.53-.3,1.71.46.36,1.5.39,3.13-.02,4.81-.73,3.05-2.93,5.55-5.74,6.8l-1.38-1.38c-1.4-1.41-3.27-2.18-5.26-2.18-.58,0-1.17.07-1.74.26Z" />
                                        </g>
                                    </g>
                                </g>
                            </svg>
                        </span>
                        <span> Installation Services </span>
                    </h2>
                    <div class="productView-services-text">
                        <!-- <p>{service.Description__c}
    
                    </p> -->
                    </div>
                </div>
                <div class="productView-services-price"> <a onclick={openMoocodesChange}>Edit Services</a></div>
            </div>
        </div>

        <div class="productView-services">
            <template for:each={_installationServices} for:item="service">
                <div key={service.Id} class="d-flex align-items-top justify-content-spaceBetween">
                    <div>
                        <h2 class="productView-services-title">
                            <span class="icon slds-icon slds-icon_xx-small"><svg>
                                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#announcement"></use>

                                </svg></span>
                            <span>{service.Name}</span>
                        </h2>
                        <div class="productView-services-text">
                            <!-- <p>{service.Description__c}
    Name, BWC_SKU__c, BWC_Service_Type__c, Cart_Item__c, BWC_Service_Description__c, BWC_Service_Price__c
                    </p> -->
                        </div>
                    </div>
                    <template if:false={isMember}>
                        <div class="productView-services-price">${service.BWC_Service_Price__c}</div>
                    </template>
                    <template if:true={isMember}>
                        <template if:true={service.free}>
                            <div>
                                <span class="free"> FREE </span>
                                <span class="productView-services-price-member"> ${service.BWC_Service_Price__c}</span>
                            </div>
                        </template>
                        <template if:false={service.free}>
                            <template if:false={service.isSame}>
                                <div>
                                    <span class="free"> ${service.BWC_Member_Price__c} </span>
                                    <span class="productView-services-price-member"> ${service.BWC_Service_Price__c}</span>
                                </div>
                            </template>
                            <template if:true={service.isSame}>
                                <div>
                                    <span class="free"> ${service.BWC_Member_Price__c} </span>
                                    <!-- <span class="productView-services-price-member"> ${service.BWC_Service_Price__c}</span> -->
                                </div>
                            </template>
                            

                        </template>


                    </template>

                </div>


            </template>
        </div>
    </template>
    <template if:false={installationFlag}>
        <div class="productView-services-false">
            <h2 class="productView-services-title">
                <span class="icon slds-icon slds-icon_xx-small"></span>
                <span>Installation Not Available</span>
            </h2>
            <!-- <div class="d-flex align-items-top justify-content-spaceBetween">
                <div>
                    <h2 class="productView-services-title">
                        <span class="icon slds-icon slds-icon_xx-small"></span>
                        <span>Installation Not Available</span>
                    </h2>
                    <div class="productView-services-text">
                        <p>

                        </p>
                    </div>
                </div>
                <div class="productView-services-price">$0.00</div>
            </div> -->

        </div>
    </template>
    </template>




    <template if:true={openModalServices}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <div class="modal-border">
                    <div class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" onclick={cancelAndCloseSuccess}>
                            <svg viewBox="0 0 16 16">
                                <path
                                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z">
                                </path>
                            </svg>
                            <span class="slds-assistive-text">Cancel and close</span>
                        </button>
                        <div class="title">

                            <h2 class="text slds-m-left_large dxp-text-heading-large">Installation Services</h2>
                        </div>
                    </div>
                    <div class="slds-modal__content slds-p-horizontal_medium">

                        <div class="offer-list slds-m-vertical_medium">
                            <div class="offer-row">
                                <template if:true={mcodeFlag}>

                                    <div class="subtitle-container">
                                      
                                        <div class="form-field">
    
                                            <template for:each={addServicesList} for:item="item">
                                                <div key={item.id} class="input-container">
                                                    <input type="checkbox" class="form-radio" name="protectionPlan"
                                                        data-name="addons" value={item.id}>
                                                    <label class="form-label" for={item.id}>
                                                        <div class="d-flex justify-content-spaceBetween">
                                                            <p>{item.description}</p>
                                                            <p><strong>${item.price}</strong></p>
                                                        </div>
    
    
    
                                                    </label>
                                                </div>
                                            </template>
    
                                        </div>
                                    </div>
                                </template>
                             
                            </div>
                          

                        </div>
                    </div>

                    <div class="slds-modal__footer">
                        <div class="cta-container">
                            <button class="footerButton1 slds-button slds-button_neutral"
                                onclick={cancelAndClose}> CANCEL</button>
                         <button class="footerButton2 slds-button slds-button_outline-brand" onclick={AddandClose}> SAVE CHANGES </button> 
                        </div>

                    </div>
                </div>
            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>


    </template>
