<template>
    <lightning-card class="card">
        <div class="slds-grid">
            <div class="title slds-col">
                Order Summary
            </div>

        </div>
    </lightning-card>
    
    <lightning-card class="card">
        <template for:each={bodewellOrderListItems} for:item="orderItem">
            <div class="eop slds-grid slds-wrap" key={orderItem.id}>
                <div class="slds-col slds-size_1-of-4">
                    <div class="image slds-text-align_center slds-m-around_x-small">
                        <template if:true={orderItem.Product2.BWC_Main_Image__c}>
                            <img src={orderItem.Product2.BWC_Main_Image__c}
                                alt={orderItem.Product2.BWC_Main_Image__c} />
                        </template>
                    </div>
                </div>


                <div class="slds-col slds-size_2-of-4">
                    <div class="content1 slds-m-around_x-small">
                        <!-- <button class="product-name slds-button" data-id={cartItem.ProductDetails.productId} onclick={onclickProductName}> -->
                        {orderItem.Product2.BWC_Product_Marketing_Description__c }
                        <!-- </button> -->

                        <div class="model">
                            Model#: {orderItem.Product2.StockKeepingUnit}
                        </div>
                    </div>
                </div>

                <div class="price slds-col slds-size_1-of-4">
                    <lightning-formatted-number                   
                        value= {orderItem.TotalPrice}
                        maximum-fraction-digits="2"
                        currency-code={currencyCode}
                        format-style="currency">
                </lightning-formatted-number>
                </div>

            </div>
            <div class="borderservices" key={orderItem.id}>
                <div  class="slds-grid slds-wrap  " >
                    <div class="installation-sop slds-size_12-of-12">
                        <c-bwc_checkout-installation-services data-id={orderItem.id}  cart-item-id={orderItem.cart_Item_Id__c} zip-code={zipCode}
                            product-quantity={orderItem.Quantity} is-member={isMember}
                            product-id={orderItem.Product2Id} cart-id={orderItem.OrderSummary.BWC_Cart_Id__c}   oninstall={installationChangeCapture}  >
                        </c-bwc_checkout-installation-services>
                    </div>
    
                </div>
                <div class=" slds-grid slds-wrap" >
    
                    <div class="installation-sop slds-size_12-of-12">
                        <c-bwc_bodewell-care-protection-plan data-id={orderItem.id} cart-item-id={orderItem.cart_Item_Id__c}
                            product-quantity={orderItem.Quantity} is-member={isMember} is-small-appliance={orderItem.Product2.BWC_Small_Appliance__c}
                            product-id={orderItem.Product2Id} service-contracts={orderItem.Product2.BWC_Service_Contracts__c} cart-id={orderItem.OrderSummary.BWC_Cart_Id__c}>
                        </c-bwc_bodewell-care-protection-plan>
                    </div>
    
    
                </div>
            </div>
           
        </template>


        <template if:true={installationFlag}>
            <div class="productView-services">
                <template for:each={_installationServices} for:item="service">
                    <div key={service.Id} class="d-flex align-items-top justify-content-spaceBetween">
                        <div>
                            <h2 class="productView-services-title">

                                <span class="icon slds-icon slds-icon_x-small">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
                                        <g>
                                            <g class="e">
                                                <g class="e">
                                                    <path class="f"
                                                        d="m35.23,27.69c1.02,1.03,1.02,2.69,0,3.71l-3.71,3.71c-1.02,1.02-2.68,1.02-3.71,0l-8.23-8.23c-1.63-1.63-1.94-4.05-.98-6l-7.5-7.5h-4.36S0,4.44,0,4.44L4.5,0l8.94,6.75v4.36l7.56,7.5c1.96-.96,4.38-.65,6,.98l8.23,8.1Zm-18.76-1.46l-8.37,8.37c-.93.93-2.14,1.39-3.36,1.39s-2.43-.46-3.35-1.39c-1.85-1.85-1.85-4.86,0-6.71l10.47-10.47,4.16,4.16c-.37,1.58-.17,3.19.45,4.65Zm-10.29,5.26c0-.94-.76-1.69-1.69-1.69s-1.69.75-1.69,1.69.76,1.69,1.69,1.69,1.69-.75,1.69-1.69Zm15.4-15.48l-5.82-5.83c0-.56.01-1.13.12-1.72.62-3.95,3.65-7.25,7.54-8.18,1.68-.4,3.31-.38,4.81-.02.76.18,1.02,1.16.46,1.71l-4.84,4.84v5.25h5.32l4.84-4.84c.56-.56,1.53-.3,1.71.46.36,1.5.39,3.13-.02,4.81-.73,3.05-2.93,5.55-5.74,6.8l-1.38-1.38c-1.4-1.41-3.27-2.18-5.26-2.18-.58,0-1.17.07-1.74.26Z" />
                                                </g>
                                            </g>
                                        </g>
                                    </svg>
                                </span>
                                <span>{service.Name}</span>
                            </h2>
                            <div class="productView-services-text">
                                <!-- <p>{service.Description__c}
            
                            </p> -->
                            </div>
                        </div>
                        <div class="productView-services-price">
                            <div class="itemTitleFree">
                                <template if:true={memberinstallationflag}>
                                <template if:true={free}>
                                    <p class="memberValue">{free}</p>
                                    <p class="memberTotalvalue">${service.BWC_Service_Price__c}</p>
                                </template>
                                <template if:false={free}>
                                    <p class="memberValue">${service.BWC_Member_Price__c }</p>
                                    <p class="memberTotalvalue">${service.BWC_Service_Price__c}</p>
                                </template>
                                </template>
                                <template if:false={memberinstallationflag}>
                                    <p class="value">${service.BWC_Service_Price__c}</p>
                                </template>
                            </div>
                        
                        </div>


                    </div>
                </template>
            </div>       
        <!-- </div> -->
        </template>


        <c-bwc_mya-my-Order_-order-summary rid={rid}></c-bwc_mya-my-Order_-order-summary>
</lightning-card>
</template>
