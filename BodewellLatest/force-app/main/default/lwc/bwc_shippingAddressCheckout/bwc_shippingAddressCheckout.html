<template>
    
 
    <fieldset class="slds-form-element slds-form-element_compound slds-p-around_x-large">
        <template if:false={openEditAddress}>

        <div class="header-container">
            <h2 class="headerAddress">             <lightning-icon class="successIcon" icon-name="action:approval" size="x-small" ></lightning-icon>
                Customer</h2>
            <button onclick={editAddress} class="slds-button slds-button_outline-brand buttonEdit">EDIT</button>

        </div>
      
        <div class="addContainer">
            <p>{finalShippingAddress}
            </p>
        </div>
</template>
<template if:true={openEditAddress}>
    <div class="header-container-clone">
    <span class="icon slds-icon slds-icon_x-small"><svg  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33">
        <g ><g ><circle class="g" cx="16.5" cy="16.5" r="16.5"/></g><g id="e" class="f"><g class="f"><path class="h" d="m15,12.48h-3.41v-1.98c1.85-.07,3.5-.75,3.81-2.68h2.62v15.18h-3.01v-10.52Z"/></g></g></g></svg>
       </span>
        <h2 class="headerAddress" > 
           Customer</h2>
            </div>

        <template if:true={multipleAddress}>
            <div class="slds-form-element__control">
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <!-- <label class="slds-form-element__label" for="input-01">Shipping Address</label> -->
                            <div class="slds-form-element__control">
                                <select onchange={handelSelectedAddress} name="address" data-name="address" title="Address" class="slds-input inputPadding">
                                    <!-- <template if:true={selectedAddress}>
                                        <option value={selectedAddress.value}>{selectedAddress.label}</option>
                                    </template> -->
                                    <template if:true={addressOptions}>
                                        <template for:each={addressOptions} for:item="address">
                                            <option key={address.value} value={address.label}>{address.label}</option>

                                        </template>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <template if:true={isOneAddress}>
            <h2 class="headerAddress-clone"> </lightning-icon>
                Shipping Address</h2>
            <div class="addContainer">
                <p>{oneAddress.label}
                </p>
            </div>

        </template>
<template if:true={shipAdddressFlag}>
<template if:false={noAddress}>
        <div class="addContainer">
            
            <span class="iconAdd slds-icon slds-icon_xx-small"><svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
                <path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 344V280H168c-13.3 0-24-10.7-24-24s10.7-24 24-24h64V168c0-13.3 10.7-24 24-24s24 10.7 24 24v64h64c13.3 0 24 10.7 24 24s-10.7 24-24 24H280v64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"/></svg>
            </span>
            <a onclick={addNewAddress} class=" addAddress">Ship To A Different
                    Address</a>

        </div>
    </template> 
    <template if:true={noAddress}>
        <div class="addContainer">
            
            <span class="iconAdd slds-icon slds-icon_xx-small">
                <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM184 232H328c13.3 0 24 10.7 24 24s-10.7 24-24 24H184c-13.3 0-24-10.7-24-24s10.7-24 24-24z"/></svg>
            </span>
            <a onclick={addNewAddressClose} class=" addAddress">Ship To A Different
                    Address</a>

        </div>

    </template>
</template>
        <template if:true={noAddress}>
            <div class="slds-form-element__control">
                <div class="slds-form-element__row">
                    <div class="slds-size_1-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">First Name*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleFirstNameChange} type="text" data-name="First Name" id="input-01" class="slds-input inputPadding" value=""  placeholder="Enter Your First Name…"  aria-describedby="error-message-id-51"  />
  </div>
                  <div class="slds-form-element__help error" id="error-message-id-51">{showFirstNameError}</div>
                        </div>
                    </div>
                    <div class="slds-size_1-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-02">Last Name*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleLastNameChange} data-name="Last Name" type="text" id="input-02" class="slds-input inputPadding" value="" placeholder="Enter Your Last Name…"  aria-describedby="error-message-id-52"  />
                            </div>
                                            <div class="slds-form-element__help error" id="error-message-id-52">{showLastNameError}</div>
                        </div>
                    </div>
                </div>
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">Address*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleAddressChange}  data-name="Address" type="text" id="input-03" class="slds-input inputPadding" placeholder="Enter Your Address…"  aria-describedby="error-message-id-53"  />
                            </div>
                                            <div class="slds-form-element__help error" id="error-message-id-53">{showAddressError}</div>
                        </div>
                    </div>

                </div>
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">Address Line 2</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleAddressLine2Change} data-name="Address2" type="text" id="input-04" class="slds-input inputPadding" />
                            </div>
                        </div>
                    </div>

                </div>
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">City*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleCityChange} data-name="City"  type="text" id="input-05" class="slds-input inputPadding" placeholder="Enter Your City..."  aria-describedby="error-message-id-54"  />
                            </div>
                                            <div class="slds-form-element__help error" id="error-message-id-54">{showCityError}</div>
                 
                        </div>
                    </div>

                </div>
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">State*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleStateChange} data-name="State" type="text" id="input-06" class="slds-input inputPadding" placeholder="Enter Your State..."  aria-describedby="error-message-id-55"  />
                            </div>
                                            <div class="slds-form-element__help error" id="error-message-id-55">{showStateError}</div>
                        </div>
                    </div>

                </div>
                <div class="slds-form-element__row">
                    <div class="slds-size_2-of-2">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label inputLabel" for="input-01">Zip*</label>
                            <div class="slds-form-element__control">
                                <input onchange={handleZipChange} data-name="Zip" type="text" id="input-07" class="slds-input inputPadding" placeholder="Enter Your Zip..."  aria-describedby="error-message-id-56"  />
                            </div>
                                            <div class="slds-form-element__help error" id="error-message-id-56">{showZipError}</div>
                        </div>
                    </div>

                </div>

            </div>
        </template>
        <div class="slds-form-element__control">
            <div class="slds-form-element__row">
                <div class="slds-size_2-of-2">
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">


                            <input onclick={sendAddressToBilling} class="inputPadding" data-name=" Billing Checkbox" type="checkbox"  id="checkbox-unique-id-34"
                                value="checkbox-unique-id-34" />
                            <label class="checkbox__label" for="checkbox-unique-id-34">

                                <span class="slds-form-element__label">My billing address is the same as my shipping
                                    address</span>
                            </label>

                        </div>
                    </div>
                </div>

            </div>
            <div class="slds-form-element__row">
                <div class="slds-size_2-of-2">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label inputLabel" for="input-01">Phone Number</label>
                        <div class="slds-form-element__control">
                            <input type="text" id="input-08" data-name="Phone" class=" inputPadding slds-input" placeholder="Enter phone number…" required  />
                        </div>

                    </div>
                </div>

            </div>
            <div class="slds-form-element__row">
                <div class="slds-size_2-of-2">
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">


                            <input type="checkbox" data-name="Textme" value="checkbox-unique-id-34" class="inputPadding" />
                            <label class="checkbox__label" for="checkbox-unique-id-34">

                                <span class="slds-form-element__label">Text Me Order Confirmation</span>
                            </label>
                            <p>You expressly consent to GE Appliances contacting you at this number by voice or text.
                            </p>

                        </div>
                    </div>
                </div>

            </div>
            <div class="slds-form-element__row">
                <div class="slds-size_2-of-2">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label inputLabel" for="input-01">Have a referral code?(optional)</label>
                        <p>This is a code you may have received from a service technician or customer service
                            representative.</p>
                        <div class="slds-form-element__control">
                            <input type="text" id="input-09" data-name="referralCode" class="slds-input inputPadding" />
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="button-container">
            <button class=" slds-button slds-button_brand continueButton" onclick={handleContinue}> CONTINUE
            </button>
        </div>
    </template>
    </fieldset>



    <c-bwc_billing-address-checkout account-id={accountId} ></c-bwc_billing-address-checkout>

</template>
