            <div class="slds-p-around_medium lgc-bg">
                <template if:true={OrdersLoading}>
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </template>
            
                <div class="row">
                    <div class="col-50">
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="phonenumber" onkeypress={handleEnter}
                            label="Phone Number" variant="scoped" placeholder="Phone Number"></lightning-input>
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="ordernumber" onkeypress={handleEnter}
                            label="Order Number" variant="scoped" placeholder="Order Number"></lightning-input>
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="ponumber" label="PO Number" onkeypress={handleEnter}
                            variant="scoped" placeholder="PO Number"></lightning-input>
                        <!--<lightning-input class="inputbox" type="text" data-id="reset" data-name="firstname" label="First Name" variant="scoped" placeholder="First Name"></lightning-input>
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="lastname" label="Last Name" variant="scoped" placeholder="Last Name"></lightning-input>
                        -->
                    </div>
                    <div class="col-50">
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="trackingumber" onkeypress={handleEnter}
                            label="Tracking Number" variant="scoped" placeholder="Tracking Number"></lightning-input>
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="referencenumber" onkeypress={handleEnter}
                            label="Reference Number" variant="scoped" placeholder="Reference Number"></lightning-input>
                        <lightning-input class="inputbox" type="text" data-id="reset" data-name="email" label="Email" onkeypress={handleEnter}
                            variant="scoped" placeholder="Email"></lightning-input>
                        <!--<lightning-input class="inputbox" type="text" data-id="reset" data-name="zipcode" label="Zipcode" variant="scoped" placeholder="Zipcode"></lightning-input>
                        -->
                    </div>
                </div>
                <div class="row">
                    <p class="search-msg">Please input the search criteria into only <b>1 field</b> before clicking search.</p>
                    <p class="search-msg">Data in <b>REFERENCE</b>, <b>TRACKING </b> and <b>EMAIL</b> fields will be converted to uppercase. <b>PO is case sensitive.</b></p>
                
                </div>
                <div class="row">
                    <div class="col-50">
                        <lightning-button variant="brand" label="Search" title="Search Orders" icon-name="utility:search"
                            icon-position="right" onclick={getOrdersData} class="lbutton"></lightning-button>

                    <!--slds-align_absolute-center<lightning-button variant="brand" label="Search" title="Search" onclick={getOrdersData} class="slds-m-left_x-small"></lightning-button>-->
