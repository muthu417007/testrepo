<template>
  <template if:true={rangerId}>
    <div class="parentPopUpClass">
      <section class="modelTooltipClass" role="dialog">
        <div class="mainContainer">
          <template if:true={articlerecorexists}>
            <div class="con">
              <lightning-button-icon icon-name="utility:close" style="position:absolute;left:95%;top:1%" size="x-small"
                onclick={crosspreview}>
              </lightning-button-icon>
              <div class=" containerClass">
                <div class="slds-page-header__row">
                  <div class="slds-page-header__col-title">
                    <div class="slds-media su__align-items-center">
                      <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:article" alternative-text="Email" title="Email">
                        </lightning-icon>
                      </div>
                      <div class="slds-media__body">
                        <div class="slds-page-header__name">
                          <div class="slds-page-header__name-title">
                            <lightning-record-view-form record-id={rangerId} object-api-name={objectName}>
                              <lightning-output-field field-name="Title" field-class="textHeading"
                                variant="label-hidden"></lightning-output-field>
                            </lightning-record-view-form>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="paddingBottom previewHeaderSection">
                <template if:true={showarticlepreview}>
                  <lightning-record-form record-id={rangerId} object-api-name={objectName} fields={compactLayoutFields}
                    columns="4" mode="readonly"></lightning-record-form>
                </template>
              </div>
            </div>
            <!-- Add child Component -->
            <div class="div slds-p-around_medium">
              <template if:true={showarticlepreview}>
                <c-s-u_-article-preview-child left={left} fileattachments={fileattachment} attachment={attachments}
                  kid={rangerId} object={objectName}></c-s-u_-article-preview-child>
              </template>
            </div>
          </template>
          <template if:false={articlerecorexists}>
            <h1 class="su_no-article">Article no longer exists</h1>
          </template>
        </div>
        <div class="footer"></div>
        <div class="container" lwc:dom="manual"></div>
      </section>
    </div>
  </template>
</template>
