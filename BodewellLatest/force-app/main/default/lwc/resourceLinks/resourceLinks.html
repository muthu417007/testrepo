<template>
    <div class="slds-m-bottom_large">
        <div class="dxp-text-heading-small header slds-m-left_small">
            <h1>
                {label}
            </h1>
        </div>
        <div class="colorBar slds-m-horizontal_small slds-m-bottom_medium">&nbsp;</div>
        <lightning-layout multiple-rows>
            <template for:each={links} for:item="link">
                <lightning-layout-item key={link.key} size="12" padding="horizontal-small">
                    <a href={link.URL} class="slds-m-vertical_small resourceLink" target="_blank" if:true={openInWindow}>{link.title}&nbsp;&gt;</a>
                    <span class="slds-m-vertical_small resourceLink" if:false={openInWindow} onclick={openModal} data-id={link.key}>{link.title}&nbsp;&gt;</span>
                </lightning-layout-item>
            </template>
        </lightning-layout>
    </div>
    <template if:true={modalOpen}>
        <div class="modal">
            <div class="modal-content">
                <span class="close" onclick={closeModal}>&times;</span>
                <iframe src={pdfURL} height="100%" width="100%" class="frame"></iframe>
              </div>
        </div>
    </template>
</template>
