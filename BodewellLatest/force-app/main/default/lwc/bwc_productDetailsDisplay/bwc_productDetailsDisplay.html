        <div class="slds-p-vertical_small">
            <lightning-layout vertical-align="end">
               
                <lightning-layout-item>
                    <button
                        class="slds-button slds-button_brand slds-m-left_large btn-class"
                        onclick={handleCart}
                    >
                    Add to Cart
                    </button>
                </lightning-layout-item>
                <lightning-layout-item>
                    <button
                        class="slds-button slds-m-left_x-small slds-button_outline-brand btn-class2"
                        onclick={notifyCreateAndAddToList}
                    >
                    Save
                    </button>
                </lightning-layout-item>
            </lightning-layout>
        </div>
 

 <!-- modal start -->      
 <template if:true={isShowModal}>


<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
<div class="slds-modal__container">
<!-- modal header start -->
<header class="slds-modal__header">
   <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
      <lightning-icon icon-name="utility:close"
         alternative-text="close"
         variant="inverse"
         size="small" ></lightning-icon>
      <span class="slds-assistive-text">Close</span>
   </button>
   <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Item was added to cart!</h2>
</header>

<!-- modal body start -->
<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
    <div class="slds-grid">
     <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-2">
      <button class="lwc-76nnmqsstjk slds-button slds-button_outline-brand slds-button_stretch" onclick={hideModalBox}>Continue Shopping</button>
     </div>
     <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-2">
                 <button class="lwc-76nnmqsstjk slds-button slds-button_brand slds-button_stretch slds-m-left_x-small" onclick={handleGotoCart}>Go to Cart</button>

     </div>
    </div>

</div>

<!-- modal footer start-->
<footer class="slds-modal__footer">
   <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
</footer>

</div>
</section>
<div class="slds-backdrop slds-backdrop_open"></div>
</template>
<!-- modal end -->

<c-bwc_geolocate-zipcode></c-bwc_geolocate-zipcode>
