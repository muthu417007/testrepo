<template>
    <div id="orderPrint" class="c-container">
        <div class="title slds-text-align_center">
            Order Details
        </div>
        <!-- <div>{recordId}</div> -->

            <lightning-layout multiple-rows="true">
                <!-- Heading -->
                <!-- <lightning-layout-item size="12"> -->
                <!-- </lightning-layout-item> -->
                <!-- Navigation and Print -->
                <lightning-layout-item size="12">
                    <div>
                        <button class="product-link slds-float_left" onclick={handleBackOrder}>&lt;back</button>
                        <button class="product-link right-btn" onclick={handlePrint}>

                        </button>
                    </div>
                </lightning-layout-item>

                        <!-- <div key={it.value.id} class="slds-grid slds-wrap slds-clearfix slds-p-around_small"> -->

                            class="slds-float_left slds-col slds-size_8-of-12 slds-p-around_small padd-out mob-width-align">

                                <lightning-layout-item flexibility="auto" size="12"
                                    class="slds-m-bottom_medium slds-p-around_small"
                                    style="background-color: white;margin-bottom: 2rem;">
                                    <!-- <div class="paddingaround"> -->
                                    <div class="sub-title capitalise">Order Number: <span>{Details.OrderNumber}</span>
                                    </div>
                                    <div class="sub-title capitalise">Reference Number: <span>{Details.OrderRefNumber}</span></div>
                                    <div class="sub-title capitalise">Order Date: <span>{Details.OrderDate}</span></div>
                                    <!-- </div> -->
                                </lightning-layout-item>

                                <lightning-layout-item if:false={Details.MixedShipFlag} flexibility="auto" size="12"
                                    class="slds-m-bottom_medium slds-p-around_small padd-internal">
                                    <div>
                                        <!-- delivery method section -->
                                        <div if:true={Delivery}>
                                            <div class="sub-title uppercase">DELIVER TO</div>
                                            <div class="test">
                                                <p class="details-text slds-float_left">
                                                    <b>{Details.CustName}</b>, {Details.ShipAddLine1}, {Details.ShipAddLine2}
                                                </p>
                                            </div>
                                            <div if:false={Details.BackOrderFlag}>
                                                <!-- <div if:true={Details.OrderStatusPendFlag}>
                                                    <div class="orderStatus">Scheduled Delivery Date:</div>                                               
                                                </div> -->
                                                <div if:true={Details.OrderStatusCompFlag}>
                                                    <div class="orderStatus">Delivered</div>
                                                </div>
                                                <div if:true={Details.OrderStatusCancelFlag}>
                                                    <div class="orderStatus">Cancelled</div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- shipping -->
                                        <div if:true={Ship}>
                                            <div class="sub-title uppercase">SHIP TO</div>
                                            <p class="slds-float_left"><b>{Details.CustName}</b>, {Details.ShipAddLine1}, {Details.ShipAddLine2}</p>
                                            <div if:false={Details.BackOrderFlag}>
                                                <div if:true={Details.OrderStatusPendFlag}>
                                                    <div if:false={Details.IsOrderAwaitingShippingFlag}>
                                                        <div class="orderStatus">Shipped {Details.OrderShipDate}</div>
                                                        <p class="slds-float_left">(FedEx Ground Usually Ships In 2-7
                                                        Business Days)</p>
                                                    </div>
                                                    <div if:true={Details.IsOrderAwaitingShippingFlag} class="orderStatus">Awaiting Shipping</div>
                                                </div>
                                                <div if:true={Details.OrderStatusCompFlag}>
                                                    <div class="orderStatus">Shipped {Details.OrderShipDate}</div>
                                                </div>
                                                <div if:true={Details.OrderStatusCancelFlag}>
                                                    <div class="orderStatus">Cancelled</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="slds-float_left" if:true={PickUp}>
                                            <div class="sub-title uppercase">PICK UP LOCATION</div>
                                            <div if:true={Agent}>
                                                <p><b>{Agent.name}</b>, {Agent.address}, {Agent.city}, {Agent.state}&nbsp;{Agent.zipcode}
                                                </p>
                                                <p>{Agent.phone}</p>
                                            </div>

                                                <div if:true={Details.IsOrderAwaitingReturnFlag} class="orderStatus">Awaiting Return</div>
                                            </div>
                                            <div if:true={Details.OrderStatusCompFlag}>
                                                <div class="orderStatus">Items Ready For PickUp</div>
                                            </div>
                                            <div if:true={Details.OrderStatusCancelFlag}>
                                                <div class="orderStatus">Cancelled</div>
                                            </div>
                                        </div>
                                        <div>

                                            <div if:true={Details.BackOrderFlag}>

                                            </div>

                                                            <lightning-formatted-url class="slds-m-left_xx-small " label="Track My Order"

                                                            </lightning-formatted-url>
                                                        </div>
                                                        <div if:true={Details.ShowReschedule} class="reschedule">

                                                                size='xx-small' title='info'></lightning-icon>
                                                            <lightning-formatted-url class="slds-m-left_xx-small " label="Reschedule"

                                                            </lightning-formatted-url>
                                                        </div>

                                                                size='xx-small' title='info'></lightning-icon>

                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                            class="slds-float_right slds-col slds-size_4-of-12 slds-p-around_small padd-out-right mob-width-align">
                            <lightning-layout vertical-align="stretch" multiple-rows="true"
                                class="padding-internal-two">
                                <lightning-layout-item flexibility="auto" size="12" class="slds-p-around_small">
                                    <div class="sub-title uppercase margin-1">ORDER SUMMARY</div>
                                    <div class="slds-float_left ">
                                        <p class="slds-p-left_medium slds-text-heading_medium noMargin ord-left-text">
                                            Subtotal</p>
                                        <div if:true={Details.OrdDiscFlag}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-left-text">
                                                Discount (-)</p>
                                        </div>
                                        <div if:true={Ship}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-left-text">
                                                Standard Shipping</p>
                                        </div>
                                        <div if:true={Details.OrderDeliveryChargeFlag}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-left-text">
                                                Delivery</p>
                                        </div>
                                        <p class="slds-p-left_medium slds-text-heading_medium noMargin ord-left-text">
                                            Tax</p><br />
                                        <p class="slds-p-left_medium slds-text-heading_medium font-500 ord-left-text">
                                            <strong>Total</strong>
                                        </p>
                                    </div>
                                    <div class="slds-float_right">
                                        <p class="slds-p-right_medium slds-text-heading_medium noMargin ord-right-text">
                                            ${Details.OrderSubTotalString}</p>
                                        <div if:true={Details.OrdDiscFlag}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-right-text">
                                                ${Details.OrderDiscountString}</p>
                                        </div>
                                        <div if:true={Ship}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-right-text">
                                                ${Details.OrderShippingCharge}</p>
                                        </div>
                                        <div if:true={Details.OrderDeliveryChargeFlag}>
                                            <p
                                                class="slds-p-left_medium slds-text-heading_medium noMargin ord-right-text">
                                                ${Details.OrderDeliveryCharge}</p>
                                        </div>
                                        <p class="slds-p-right_medium slds-text-heading_medium noMargin ord-right-text">
                                            ${Details.OrderTaxString}</p><br />
                                        <p class="slds-p-right_medium slds-text-heading_medium font-500 ord-right-text">
                                            <strong>${Details.OrderTotalString}</strong>
                                        </p>
                                    </div>
                                </lightning-layout-item>
                                <div>
                                    <div class="slds-p-around_large slds-float_left"
                                        style="border-bottom: solid 1px rgb(168, 166, 166);">
                                        Due to our delivery process, products added to your order 24 hours after it is
                                        placed may result in additional delivery fees.
                                    </div>
                                </div>
                                <lightning-layout-item flexibility="auto" size="12"
                                    class="slds-m-bottom_medium slds-p-around_small"
                                    style="border-bottom: solid 1px rgb(168, 166, 166);">
                                    <div class="sub-title uppercase margin-1 ">BILLING DETAILS</div>
                                    <div class="slds-p-left_large noMargin bill-left-text">{Details.CustName}</div>
                                    <div class="slds-p-left_large noMargin bill-left-text">{Details.BillAddLine1}</div>
                                    <div class="slds-p-left_large bill-left-text">{Details.BillAddLine2}</div>

                                </lightning-layout-item>
                                <lightning-layout-item flexibility="auto" size="12"
                                    class="slds-m-bottom_medium slds-p-around_small">
                                    <div class="sub-title uppercase margin-1">CONTACT DETAILS</div>
                                    <div class="slds-p-left_large noMargin cont-left-text">{Details.CustName}</div>
                                    <div class="slds-p-left_large noMargin cont-left-text">{Details.CustPhone}</div>
                                    <div class="slds-p-left_large noMargin cont-left-text-nocap">{Details.CustEmail}
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>
                        </div>
                        <!-- </div> -->
                        <!-- </template> -->
                    </div>
                </lightning-layout-item>
            </lightning-layout>
        </template>
        <div if:true={showMsg} class="slds-text-heading_small">
            ORDER DETAILS NOT FOUND
        </div>
    </div>
</template>
