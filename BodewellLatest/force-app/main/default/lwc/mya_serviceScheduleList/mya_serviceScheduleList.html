      <div if:false={ishaier}>

          </div>
        </div>
        <div if:false={ishaier}>
          <div if:true={iscafe}>
              <p class="p2"><a class="track-link-cafe" href={trackUrl}>Track Your Service</a></p>
            </div>

          <div if:true={ishaier}>
            <div if:false={iscafe}>

        </template>
</template>

        </template>
</template>
<template if:true={iscafe}>

</template>
