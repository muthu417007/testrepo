<template>
    <lightning-card title="Billing Address">
      <div class="slds-var-p-around_medium">
        <lightning-input label="First Name" value={firstName}></lightning-input>
        <lightning-input label="Last Name" value={lastName}></lightning-input>
        <lightning-input label="Address" value={address}></lightning-input>
        <lightning-input label="Address Line 2" value={addressLine2}></lightning-input>
        <lightning-input label="City" value={city}></lightning-input>
        <lightning-input label="State" value={state}></lightning-input>
        <lightning-input label="Zip" value={zip}></lightning-input>
        <lightning-input label="Phone Number" value={phoneNumber}></lightning-input>
      </div>
    </lightning-card>
  </template>
